<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Playground | modbot</title>

    <link rel="apple-touch-icon" sizes="120x120" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg: #f0f0f0;
            --card: #ffffff;
            --menu: #ffffff;
            --border: #d9d9d9;
            --text: #000000;
            --text-secondary: #888;
            --success: #2d8c46;
            --danger: #c62828;
            --warning: #c78a00;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Microsoft JhengHei', sans-serif;
        }

        .logo {
            position: absolute;
            top: 10px;
            left: 10px;
            font-weight: bold;
            margin-top: 20px;
            margin-left: 25px;
            font-size: 22px;
            text-decoration: none;
            color: var(--text);
        }

        .container {
            width: min(900px, calc(100% - 32px));
            margin: 100px auto 40px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }

        h1 {
            margin: 0;
            font-size: 26px;
        }

        .subtitle {
            margin: 8px 0 24px;
            color: var(--text-secondary);
            font-size: 15px;
        }

        .connection {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .connection input {
            flex: 1;
            min-width: 0;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 13px;
            background: var(--menu);
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: monospace;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 11px 16px;
            cursor: pointer;
            font-size: 15px;
            background: var(--text);
            color: var(--card);
            white-space: nowrap;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        button.secondary {
            background: var(--border);
            color: var(--text);
        }

        button.success {
            background: var(--success);
            color: white;
        }

        button.danger {
            background: var(--danger);
            color: white;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-secondary);
        }

        .status.connected .status-dot {
            background: var(--success);
        }

        .status.connecting .status-dot {
            background: var(--warning);
        }

        .status.disconnected .status-dot {
            background: var(--danger);
        }

        .section {
            margin-top: 24px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .section-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .log {
            height: 360px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            background: var(--menu);
            font-family: monospace;
            font-size: 13px;
        }

        .log-entry {
            padding: 9px 8px;
            border-bottom: 1px solid var(--border);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-time {
            color: var(--text-secondary);
        }

        .log-in {
            color: var(--success);
        }

        .log-out {
            color: #356cb8;
        }

        .log-system {
            color: var(--text-secondary);
        }

        .log-error {
            color: var(--danger);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .stat {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-family: monospace;
            font-size: 17px;
        }

        .message-row {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .message-row textarea {
            flex: 1;
        }

        @media (max-width: 650px) {
            .connection {
                flex-direction: column;
                align-items: stretch;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .message-row {
                flex-direction: column;
            }

            .message-row button {
                width: 100%;
            }
        }

        .dialog-overlay {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .45);
            z-index: 10000;
        }

        .dialog {
            width: min(420px, 90vw);
            max-height: 90dvh;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .dialog-body {
            overflow-y: auto;
            flex: 1;
        }

        .dialog-buttons {
            display: flex;
            flex-shrink: 0;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }

        .dialog-buttons button {
            padding: 10px 18px;
        }

        .dialog-danger {
            background: var(--danger);
            color: white;
        }

        .dialog-primary {
            background: var(--success);
            color: white;
        }

        .dialog-header p {
            margin: 8px 0 0;
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.5;
        }

        .hidden {
            display: none;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #222222;
                --card: #121212;
                --menu: #1f1f1f;
                --border: #555555;
                --text: #ffffff;
                --text-secondary: #888;
                --success: #2d8c46;
                --danger: #c62828;
                --warning: #c78a00;
            }
        }
    </style>
</head>

<body>

<a class="logo" href="/">modbot.dev</a>

<div class="container">

    <div class="card">

        <h1>WebSocket Playground</h1>

        <p class="subtitle">
            Experiment with the WebSocket Gateway protocol.
        </p>

        <!-- Connection -->

        <div class="connection">

            <input
                id="wsUrl"
                type="text"
                placeholder="WebSocket URL"
                autocomplete="off"
            >

            <button id="connectButton" class="success">
                Connect
            </button>

            <button id="disconnectButton" class="danger" disabled>
                Disconnect
            </button>

        </div>

        <!-- Status -->

        <div id="status" class="status disconnected">

            <span class="status-dot"></span>

            <span id="statusText">
                Disconnected
            </span>

        </div>

        <!-- Statistics -->

        <div class="stats">

            <div class="stat">

                <div class="stat-label">
                    Last Sequence
                </div>

                <div id="lastSeq" class="stat-value">
                    null
                </div>

            </div>

            <div class="stat">

                <div class="stat-label">
                    Heartbeat Interval
                </div>

                <div id="heartbeatInterval" class="stat-value">
                    —
                </div>

            </div>

            <div class="stat">

                <div class="stat-label">
                    Last ACK
                </div>

                <div id="lastAck" class="stat-value">
                    —
                </div>

            </div>

        </div>

        <!-- Event Log -->

        <div class="section">

            <div class="section-header">

                <h2>Events</h2>

                <button id="clearButton" class="secondary">
                    Clear
                </button>

            </div>

            <div id="log" class="log"></div>

        </div>

        <!-- Message -->

        <div class="section">

            <div class="section-header">

                <h2>Send Message</h2>

            </div>

            <div class="message-row">

                <textarea
                    id="messageInput"
                    spellcheck="false"
                    placeholder='{"op": 1, "d": null}'
                ></textarea>

                <button id="sendButton" disabled>
                    Send
                </button>

            </div>

        </div>

    </div>

</div>


<!-- Dialog -->

<div id="dialogOverlay" class="dialog-overlay hidden">

    <div class="dialog">

        <div class="dialog-header">

            <h2 id="dialogTitle"></h2>

            <p id="dialogMessage"></p>

        </div>

        <div id="dialogBody" class="dialog-body"></div>

        <div id="dialogButtons" class="dialog-buttons"></div>

    </div>

</div>


<script>
let ws = null;

let lastSeq = null;
let heartbeatInterval = null;
let heartbeatTimer = null;
let lastAck = null;

let sessionId = null;
let resumeUrl = null;

let authenticated = false;
let authenticationPending = false;


/*
 * Gateway Opcodes
 *
 * 0  DISPATCH
 * 1  HEARTBEAT
 *
 * 10 HELLO
 * 11 HEARTBEAT_ACK
 *
 * 20 AUTHENTICATE
 * 21 AUTHENTICATION_CHALLENGE
 * 22 AUTHENTICATION_RESPONSE
 */

const OP_DISPATCH = 0;
const OP_HEARTBEAT = 1;

const OP_HELLO = 10;
const OP_HEARTBEAT_ACK = 11;

const OP_AUTHENTICATE = 20;
const OP_AUTHENTICATION_CHALLENGE = 21;
const OP_AUTHENTICATION_RESPONSE = 22;


/*
 * Elements
 */

const wsUrl =
    document.getElementById("wsUrl");

const connectButton =
    document.getElementById("connectButton");

const disconnectButton =
    document.getElementById("disconnectButton");

const sendButton =
    document.getElementById("sendButton");

const clearButton =
    document.getElementById("clearButton");

const messageInput =
    document.getElementById("messageInput");

const status =
    document.getElementById("status");

const statusText =
    document.getElementById("statusText");

const lastSeqElement =
    document.getElementById("lastSeq");

const heartbeatIntervalElement =
    document.getElementById("heartbeatInterval");

const lastAckElement =
    document.getElementById("lastAck");

const log =
    document.getElementById("log");


/*
 * Default WebSocket URL
 */

const wsProtocol =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";

wsUrl.value =
    `${wsProtocol}//${location.host}/api/ws`;


/*
 * Logging
 */

function logEvent(type, message) {

    const entry =
        document.createElement("div");

    entry.className =
        "log-entry";


    const time =
        new Date().toLocaleTimeString();


    const timeElement =
        document.createElement("span");

    timeElement.className =
        "log-time";

    timeElement.textContent =
        `[${time}] `;


    const messageElement =
        document.createElement("span");


    if (type === "in") {

        messageElement.className =
            "log-in";

    } else if (type === "out") {

        messageElement.className =
            "log-out";

    } else if (type === "error") {

        messageElement.className =
            "log-error";

    } else {

        messageElement.className =
            "log-system";

    }


    messageElement.textContent =
        message;


    entry.appendChild(timeElement);
    entry.appendChild(messageElement);

    log.appendChild(entry);

    log.scrollTop =
        log.scrollHeight;
}


/*
 * Connection status
 */

function setStatus(state, text) {

    status.className =
        `status ${state}`;

    statusText.textContent =
        text;
}


/*
 * Reset Gateway state
 */

function resetGatewayState() {

    lastSeq = null;

    heartbeatInterval = null;

    lastAck = null;

    sessionId = null;

    resumeUrl = null;

    authenticated = false;

    authenticationPending = false;


    lastSeqElement.textContent =
        "null";

    heartbeatIntervalElement.textContent =
        "—";

    lastAckElement.textContent =
        "—";


    stopHeartbeat();
}


/*
 * Heartbeat
 */

function stopHeartbeat() {

    if (heartbeatTimer !== null) {

        clearInterval(heartbeatTimer);

        heartbeatTimer = null;

    }
}


function startHeartbeat(interval) {

    stopHeartbeat();


    heartbeatInterval =
        interval;


    heartbeatIntervalElement.textContent =
        `${interval} ms`;


    heartbeatTimer =
        setInterval(() => {

            if (
                !ws ||
                ws.readyState !== WebSocket.OPEN
            ) {
                return;
            }

            sendHeartbeat();

        }, interval);
}


function sendHeartbeat() {

    if (
        !ws ||
        ws.readyState !== WebSocket.OPEN
    ) {
        return;
    }


    const packet = {

        op: OP_HEARTBEAT,

        /*
         * Last Dispatch sequence received.
         *
         * null means that no sequence
         * has been received yet.
         */

        d: lastSeq

    };


    ws.send(
        JSON.stringify(packet)
    );


    logEvent(
        "out",
        `OP ${OP_HEARTBEAT} HEARTBEAT\n` +
        `${JSON.stringify(packet, null, 2)}`
    );
}


/*
 * Authentication
 */

function authenticate() {

    if (
        !ws ||
        ws.readyState !== WebSocket.OPEN
    ) {
        return;
    }


    if (
        authenticationPending ||
        authenticated
    ) {
        return;
    }


    authenticationPending =
        true;


    const packet = {

        op: OP_AUTHENTICATE,

        d: {
            method: "passkey"
        }

    };


    ws.send(
        JSON.stringify(packet)
    );


    logEvent(
        "out",
        `OP ${OP_AUTHENTICATE} AUTHENTICATE\n` +
        `${JSON.stringify(packet, null, 2)}`
    );
}


/*
 * Handle WebAuthn challenge
 */

async function handleAuthenticationChallenge(data) {

    if (
        !data ||
        !data.publicKey
    ) {

        authenticationPending =
            false;


        logEvent(
            "error",
            "Invalid authentication challenge"
        );

        return;
    }


    try {

        const publicKey = {
            ...data.publicKey
        };


        /*
         * Temporary JSON transport.
         *
         * The server currently sends the challenge
         * as Base64URL. Later this can be replaced
         * with a binary WebSocket protocol.
         */

        publicKey.challenge =
            base64urlToUint8Array(
                publicKey.challenge
            );


        const credential =
            await navigator.credentials.get({
                publicKey
            });


        if (!credential) {

            authenticationPending =
                false;


            logEvent(
                "error",
                "Passkey authentication was cancelled"
            );

            return;
        }


        const response =
            credential.response;


        /*
         * Temporary JSON representation.
         *
         * WebAuthn binary fields are converted
         * to Base64URL for now.
         */

        const assertion = {

            id:
                credential.id,

            rawId:
                uint8ArrayToBase64url(
                    new Uint8Array(
                        credential.rawId
                    )
                ),

            response: {

                clientDataJSON:
                    uint8ArrayToBase64url(
                        new Uint8Array(
                            response.clientDataJSON
                        )
                    ),

                authenticatorData:
                    uint8ArrayToBase64url(
                        new Uint8Array(
                            response.authenticatorData
                        )
                    ),

                signature:
                    uint8ArrayToBase64url(
                        new Uint8Array(
                            response.signature
                        )
                    )

            },

            type:
                credential.type

        };


        const packet = {

            op:
                OP_AUTHENTICATION_RESPONSE,

            d:
                assertion

        };


        ws.send(
            JSON.stringify(packet)
        );


        logEvent(
            "out",
            `OP ${OP_AUTHENTICATION_RESPONSE} ` +
            `AUTHENTICATION_RESPONSE\n` +
            `${JSON.stringify(packet, null, 2)}`
        );

    } catch (error) {

        authenticationPending =
            false;


        logEvent(
            "error",
            `Passkey error: ${error}`
        );

    }
}


/*
 * Gateway packet handling
 */

function handlePacket(packet) {

    if (
        typeof packet !== "object" ||
        packet === null ||
        typeof packet.op !== "number"
    ) {

        logEvent(
            "error",
            "Invalid Gateway packet"
        );

        return;
    }


    switch (packet.op) {

        /*
         * DISPATCH
         */

        case OP_DISPATCH: {

            /*
             * Every Dispatch can carry
             * a sequence number.
             */

            if (
                packet.s !== undefined
            ) {

                lastSeq =
                    packet.s;

                lastSeqElement.textContent =
                    String(lastSeq);

            }


            /*
             * READY is the first authenticated
             * Dispatch.
             */

            if (
                packet.t === "READY"
            ) {

                const data =
                    packet.d || {};


                sessionId =
                    data.session_id ?? null;


                resumeUrl =
                    data.resume_url ?? null;


                authenticated =
                    true;


                authenticationPending =
                    false;


                logEvent(
                    "in",
                    `OP ${OP_DISPATCH} READY\n` +
                    `${JSON.stringify(packet, null, 2)}`
                );


                logEvent(
                    "system",
                    `Session ID: ${
                        sessionId ?? "(none)"
                    }`
                );


                logEvent(
                    "system",
                    `Resume URL: ${
                        resumeUrl ?? "(none)"
                    }`
                );


                break;
            }


            /*
             * Other Dispatch events are only
             * meaningful after authentication.
             */

            if (!authenticated) {

                logEvent(
                    "error",
                    "Received DISPATCH before authentication"
                );

                break;
            }


            logEvent(
                "in",
                `OP ${OP_DISPATCH} DISPATCH` +
                ` seq=${packet.s ?? "null"}` +
                `\n${JSON.stringify(packet, null, 2)}`
            );

            break;
        }


        /*
         * HEARTBEAT
         *
         * Normally client -> server.
         * Receiving it here is still logged.
         */

        case OP_HEARTBEAT:

            logEvent(
                "in",
                `OP ${OP_HEARTBEAT} HEARTBEAT\n` +
                `${JSON.stringify(packet, null, 2)}`
            );

            break;


        /*
         * HELLO
         */

        case OP_HELLO: {

            const interval =
                packet.d?.heartbeat_interval;


            logEvent(
                "in",
                `OP ${OP_HELLO} HELLO\n` +
                `${JSON.stringify(packet, null, 2)}`
            );


            if (
                typeof interval === "number" &&
                interval > 0
            ) {

                startHeartbeat(
                    interval
                );

            } else {

                logEvent(
                    "error",
                    "Invalid heartbeat_interval"
                );

            }


            /*
             * Authentication starts only
             * after receiving HELLO.
             */

            authenticate();

            break;
        }


        /*
         * HEARTBEAT ACK
         */

        case OP_HEARTBEAT_ACK:

            lastAck =
                new Date();


            lastAckElement.textContent =
                lastAck.toLocaleTimeString();


            logEvent(
                "in",
                `OP ${OP_HEARTBEAT_ACK} ` +
                `HEARTBEAT_ACK\n` +
                `${JSON.stringify(packet, null, 2)}`
            );

            break;


        /*
         * AUTHENTICATION CHALLENGE
         */

        case OP_AUTHENTICATION_CHALLENGE:

            logEvent(
                "in",
                `OP ${OP_AUTHENTICATION_CHALLENGE} ` +
                `AUTHENTICATION_CHALLENGE\n` +
                `${JSON.stringify(packet, null, 2)}`
            );


            handleAuthenticationChallenge(
                packet.d
            );

            break;


        /*
         * Unknown opcode
         */

        default:

            logEvent(
                "in",
                `UNKNOWN OP ${packet.op}\n` +
                `${JSON.stringify(packet, null, 2)}`
            );

            break;

    }
}


/*
 * Connect
 */

connectButton.addEventListener(
    "click",
    () => {

        if (ws) {
            return;
        }


        const url =
            wsUrl.value.trim();


        if (!url) {

            showDialog({
                title: "Invalid URL",
                message:
                    "Please enter a WebSocket URL.",
                buttons: [
                    {
                        text: "OK",
                        primary: true,
                        value: true
                    }
                ]
            });

            return;
        }


        resetGatewayState();


        setStatus(
            "connecting",
            "Connecting..."
        );


        logEvent(
            "system",
            `Connecting to ${url}`
        );


        try {

            ws =
                new WebSocket(url);

        } catch (error) {

            logEvent(
                "error",
                String(error)
            );


            setStatus(
                "disconnected",
                "Disconnected"
            );


            ws =
                null;


            return;
        }


        /*
         * Connected
         */

        ws.addEventListener(
            "open",
            () => {

                setStatus(
                    "connected",
                    "Connected"
                );


                connectButton.disabled =
                    true;


                disconnectButton.disabled =
                    false;


                sendButton.disabled =
                    false;


                logEvent(
                    "system",
                    "WebSocket connected"
                );

            }
        );


        /*
         * Message
         */

        ws.addEventListener(
            "message",
            async event => {

                /*
                 * Text frame
                 */

                if (
                    typeof event.data === "string"
                ) {


                    try {

                        const packet =
                            JSON.parse(
                                event.data
                            );


                        handlePacket(
                            packet
                        );

                    } catch {

                        logEvent(
                            "error",
                            "Received invalid JSON"
                        );

                    }


                    return;
                }


                /*
                 * Binary Blob
                 */

                if (
                    event.data instanceof Blob
                ) {

                    const buffer =
                        await event.data.arrayBuffer();


                    const bytes =
                        new Uint8Array(buffer);


                    logEvent(
                        "in",
                        `BINARY (${bytes.length} bytes)\n` +
                        bytesToHex(bytes)
                    );


                    return;
                }


                /*
                 * Binary ArrayBuffer
                 */

                if (
                    event.data instanceof ArrayBuffer
                ) {

                    const bytes =
                        new Uint8Array(
                            event.data
                        );


                    logEvent(
                        "in",
                        `BINARY (${bytes.length} bytes)\n` +
                        bytesToHex(bytes)
                    );

                }

            }
        );


        /*
         * Close
         */

        ws.addEventListener(
            "close",
            event => {

                stopHeartbeat();


                logEvent(
                    "system",
                    `WebSocket closed: ` +
                    `code=${event.code}, ` +
                    `reason=${
                        event.reason ||
                        "(none)"
                    }`
                );


                setStatus(
                    "disconnected",
                    "Disconnected"
                );


                connectButton.disabled =
                    false;


                disconnectButton.disabled =
                    true;


                sendButton.disabled =
                    true;


                ws =
                    null;

            }
        );


        /*
         * Error
         */

        ws.addEventListener(
            "error",
            () => {

                logEvent(
                    "error",
                    "WebSocket error"
                );

            }
        );

    }
);


/*
 * Disconnect
 */

disconnectButton.addEventListener(
    "click",
    () => {

        if (!ws) {
            return;
        }


        ws.close(
            1000,
            "Client disconnect"
        );

    }
);


/*
 * Manual message sending
 */

sendButton.addEventListener(
    "click",
    () => {

        if (
            !ws ||
            ws.readyState !== WebSocket.OPEN
        ) {
            return;
        }


        const text =
            messageInput.value.trim();


        if (!text) {
            return;
        }


        try {

            JSON.parse(text);

        } catch {

            showDialog({
                title: "Invalid JSON",
                message:
                    "The message must contain valid JSON.",
                buttons: [
                    {
                        text: "OK",
                        primary: true,
                        value: true
                    }
                ]
            });

            return;
        }


        ws.send(text);


        logEvent(
            "out",
            `TEXT\n${text}`
        );


        messageInput.value =
            "";

    }
);


/*
 * Clear log
 */

clearButton.addEventListener(
    "click",
    () => {

        log.innerHTML =
            "";

    }
);


/*
 * Base64URL -> Uint8Array
 */

function base64urlToUint8Array(value) {

    const padding =
        "=".repeat(
            (4 - value.length % 4) % 4
        );


    const base64 =
        value
            .replace(/-/g, "+")
            .replace(/_/g, "/") +
        padding;


    const binary =
        atob(base64);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;
}


/*
 * Uint8Array -> Base64URL
 */

function uint8ArrayToBase64url(bytes) {

    let binary =
        "";


    for (const byte of bytes) {

        binary +=
            String.fromCharCode(byte);

    }


    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
}


/*
 * Uint8Array -> hexadecimal
 */

function bytesToHex(bytes) {

    return Array
        .from(bytes)
        .map(
            byte =>
                byte
                    .toString(16)
                    .padStart(2, "0")
        )
        .join(" ");
}


/*
 * Dialog
 */

const dialogOverlay =
    document.getElementById(
        "dialogOverlay"
    );

const dialogTitle =
    document.getElementById(
        "dialogTitle"
    );

const dialogBody =
    document.getElementById(
        "dialogBody"
    );

const dialogMessage =
    document.getElementById(
        "dialogMessage"
    );

const dialogButtons =
    document.getElementById(
        "dialogButtons"
    );


function showDialog({

    title = "",

    body = null,

    message = "",

    buttons = []

}) {

    return new Promise(
        resolve => {

            dialogTitle.textContent =
                title;


            dialogBody.innerHTML =
                "";


            dialogButtons.innerHTML =
                "";


            if (message) {

                dialogMessage.textContent =
                    message;

                dialogMessage.style.display =
                    "";

            } else {

                dialogMessage.style.display =
                    "none";

            }


            if (body) {

                dialogBody.append(
                    body
                );

            }


            dialogOverlay.classList.remove(
                "hidden"
            );


            function close(value) {

                dialogOverlay.classList.add(
                    "hidden"
                );

                resolve(value);

            }


            for (
                const button of buttons
            ) {

                const b =
                    document.createElement(
                        "button"
                    );


                b.textContent =
                    button.text;


                if (button.primary) {

                    b.classList.add(
                        "dialog-primary"
                    );

                }


                if (button.danger) {

                    b.classList.add(
                        "dialog-danger"
                    );

                }


                b.addEventListener(
                    "click",
                    () => {

                        close(
                            button.value
                        );

                    }
                );


                dialogButtons.appendChild(
                    b
                );

            }

        }
    );
}
