<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Log | modbot</title>
  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.js" nonce="{{ nonce }}"></script>
  <style>
    :root { color-scheme: light dark; font-family: 'Microsoft JhengHei', sans-serif; }
    body { margin: 0; background: #f0f0f0; color: #111; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 20px max(16px, calc((100% - 800px) / 2)); }
    .logo { color: inherit; text-decoration: none; font-size: 22px; font-weight: bold; }
    .top-actions { display: flex; gap: 8px; }
    button { border: 0; border-radius: 5px; padding: 7px 12px; cursor: pointer; color: #fff; background: #5865f2; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #submitBtn, .edit-save { background: #248046; }
    #newBtn, .edit-cancel { background: #da373c; }
    #conversationContainer { max-width: 800px; margin: 12px auto 80px; padding: 0 12px; box-sizing: border-box; }
    .conversation { position: relative; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 12px; margin-bottom: 18px; overflow-wrap: anywhere; }
    .conversation.editing { border-color: #5865f2; box-shadow: 0 0 0 2px #5865f233; }
    .entry-header { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .entry-id, .role-label { font-weight: bold; }
    .modelInfo { font-size: 14px; background: #eee; padding: 4px 8px; border-radius: 5px; }
    .entry-header .modelInfo { margin-left: auto; }
    .entry-header button { font-size: 13px; padding: 5px 8px; }
    .message-content { line-height: 1.6; overflow-wrap: anywhere; }
    .message-content p { margin: 8px 0; }
    .message-content pre, .tool-data { overflow: auto; padding: 10px; border-radius: 5px; background: #f5f5f5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message-content table { border-collapse: collapse; max-width: 100%; display: block; overflow-x: auto; }
    .message-content td, .message-content th { border: 1px solid #ccc; padding: 6px; }
    .message-content blockquote { border-left: 4px solid #ccc; margin: 8px 0; padding: 4px 12px; }
    .user-image { max-width: 100%; height: auto; }
    .edit-textarea { display: block; box-sizing: border-box; width: 100%; min-height: 80px; max-height: 50vh; resize: vertical; font-size: 16px; line-height: 1.5; font-family: inherit; padding: 8px; margin-top: 6px; }
    .edit-actions { display: flex; gap: 8px; margin: 6px 0; }
    .reasoning, .tool-history { margin: 12px 0; border: 1px solid #ccc; border-radius: 5px; padding: 8px; }
    summary { cursor: pointer; font-weight: bold; }
    .tool-call { margin: 10px 0 0; padding: 8px; border-left: 3px solid #5865f2; }
    .tool-name { font-family: monospace; font-weight: bold; overflow-wrap: anywhere; }
    .tool-label { font-size: 13px; margin: 8px 0 4px; }
    .tool-data { margin: 0; font-size: 13px; }
    .missing-output { font-style: italic; }
    @media (prefers-color-scheme: dark) {
      body { background: #1f1f1f; color: #eee; }
      .conversation { background: #101010; border-color: #555; }
      .reasoning, .tool-history { border-color: #555; }
      .modelInfo, .message-content pre, .tool-data { background: #252525; }
      .edit-textarea { background: #252525; color: #eee; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">modbot.dev</a>
    <div class="top-actions"><button id="newBtn">複製</button><button id="submitBtn">送出</button></div>
  </header>
  <main id="conversationContainer"></main>
  <script nonce="{{ nonce }}">
    const chatid = window.location.pathname.split('/').filter(Boolean).pop();
    const md = window.markdownit();
    const container = document.getElementById('conversationContainer');
    const submitButton = document.getElementById('submitBtn');
    const newButton = document.getElementById('newBtn');
    let entries = [];
    let editingState = null;
    const selected = new Map();

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function cleanText(text) {
      return typeof text === 'string' ? text.replace(/^\n+/, '') : '';
    }

    // 工具的 arguments/output 在紀錄裡是 JSON 字串；解析失敗就照原文字顯示。
    function readable(value) {
      if (typeof value !== 'string') return JSON.stringify(value ?? null, null, 2);
      if (value === '(deleted)') return '（內容已刪除）';
      try { return JSON.stringify(JSON.parse(value), null, 2); }
      catch { return value; }
    }

    function toolArguments(item) {
      if (item.name !== 'save_file') return readable(item.arguments);
      // 不在網頁上重現 save_file 的大型內容，即使舊資料還沒清理也一樣。
      try {
        const args = JSON.parse(item.arguments);
        if (args && typeof args === 'object' && 'content' in args) {
          args.content = '（檔案內容已隱藏）';
        }
        return JSON.stringify(args, null, 2);
      } catch { return '（參數無法解析，為避免洩露檔案內容而隱藏）'; }
    }

    function toolOutput(call, output) {
      if (call.name !== 'github_read_file') return readable(output);
      if (output === '(deleted)') return '（內容已刪除）';
      try {
        const result = typeof output === 'string' ? JSON.parse(output) : output;
        if (!result || typeof result !== 'object' || Array.isArray(result)) {
          return '（結果格式無法解析，已隱藏）';
        }
        // 只在畫面隱藏 content，不改動原本儲存的聊天紀錄。
        if (Object.prototype.hasOwnProperty.call(result, 'content')) {
          return JSON.stringify({ ...result, content: '（檔案內容已隱藏）' }, null, 2);
        }
        return JSON.stringify(result, null, 2);
      } catch { return '（結果格式無法解析，已隱藏）'; }
    }

    function renderToolHistory(entry) {
      const items = Array.isArray(entry.response_items) ? entry.response_items : [];
      const calls = items.filter(item => item && item.type === 'function_call');
      if (!calls.length) return null;

      const outputs = new Map();
      for (const item of items) {
        if (item && item.type === 'function_call_output' && item.call_id != null) {
          outputs.set(item.call_id, item.output);
        }
      }

      const details = element('details', 'tool-history');
      details.appendChild(element('summary', '', `工具呼叫紀錄（${calls.length} 次）`));
      for (const [index, call] of calls.entries()) {
        const block = element('section', 'tool-call');
        block.appendChild(element('div', 'tool-name', `${index + 1}. ${call.name || '未知工具'}`));
        block.appendChild(element('div', 'tool-label', '參數'));
        block.appendChild(element('pre', 'tool-data', toolArguments(call)));
        block.appendChild(element('div', 'tool-label', '結果'));
        if (outputs.has(call.call_id)) {
          block.appendChild(element('pre', 'tool-data', toolOutput(call, outputs.get(call.call_id))));
        } else {
          block.appendChild(element('div', 'missing-output', '沒有找到對應的工具結果'));
        }
        details.appendChild(block);
      }
      return details;
    }

    function renderBlock(entry, index, field, label) {
      const block = element('div', 'message-block');
      block.appendChild(element('div', 'role-label', `[${label}]`));
      if (editingState && editingState.index === index && editingState.field === field) {
        const textarea = element('textarea', 'edit-textarea');
        textarea.value = editingState.value;
        const actions = element('div', 'edit-actions');
        const save = element('button', 'edit-save', '儲存');
        const cancel = element('button', 'edit-cancel', '取消');
        save.addEventListener('click', () => {
          entry[field] = textarea.value;
          editingState = null;
          render();
        });
        cancel.addEventListener('click', () => { editingState = null; render(); });
        actions.append(save, cancel);
        block.append(textarea, actions);
      } else {
        const content = element('div', 'message-content');
        content.innerHTML = md.render(typeof entry[field] === 'string' ? entry[field] : '');
        block.appendChild(content);
      }
      return block;
    }

    function startEdit(entry, index, field) {
      editingState = { index, field, value: cleanText(entry[field]) };
      render();
      const textarea = container.querySelector('.editing textarea');
      if (textarea) textarea.focus();
    }

    function render() {
      container.replaceChildren();
      entries.forEach((entry, index) => {
        const conversation = element('article', 'conversation');
        if (editingState && editingState.index === index) conversation.classList.add('editing');
        const header = element('div', 'entry-header');
        if (entry.id === 0) {
          header.appendChild(element('span', 'entry-id', 'System'));
          const edit = element('button', '', 'Edit System Message');
          edit.addEventListener('click', () => startEdit(entry, index, 'system'));
          header.appendChild(edit);
          conversation.append(header, renderBlock(entry, index, 'system', 'System'));
        } else {
          const checkbox = element('input', 'checkbox');
          checkbox.type = 'checkbox';
          checkbox.checked = selected.get(index) ?? true;
          checkbox.addEventListener('change', () => selected.set(index, checkbox.checked));
          header.append(checkbox, element('span', 'entry-id', String(entry.id)));
          if (entry.model) header.appendChild(element('span', 'modelInfo', String(entry.model)));
          const editUser = element('button', '', 'Edit User');
          editUser.addEventListener('click', () => startEdit(entry, index, 'user'));
          const editAssistant = element('button', '', 'Edit Assistant');
          editAssistant.addEventListener('click', () => startEdit(entry, index, 'assistant'));
          header.append(editUser, editAssistant);
          conversation.append(header, renderBlock(entry, index, 'user', 'User'));
          if (entry.image_url) {
            const image = element('img', 'user-image');
            image.src = '/api/chat-images/' + encodeURIComponent(entry.image_url);
            image.alt = 'User provided image';
            conversation.appendChild(image);
          }
          if (entry.reasoning) {
            const reasoning = element('details', 'reasoning');
            reasoning.appendChild(element('summary', '', '查看思考'));
            const content = element('div', 'message-content');
            content.innerHTML = md.render(String(entry.reasoning));
            reasoning.appendChild(content);
            conversation.appendChild(reasoning);
          }
          // 工具呼叫與結果來自同一則訊息的 response_items，依 call_id 配對。
          const tools = renderToolHistory(entry);
          if (tools) conversation.appendChild(tools);
          conversation.appendChild(renderBlock(entry, index, 'assistant', 'Assistant'));
        }
        container.appendChild(conversation);
      });
    }

    function getSelectedMessages() {
      return entries.flatMap((entry, index) => {
        if (entry.id === 0) return [{ id: entry.id, system: entry.system }];
        if (selected.get(index) === false) return [];
        return [{
          id: entry.id, user: entry.user, assistant: cleanText(entry.assistant),
          reasoning: entry.reasoning || null, model: entry.model || null,
          image_url: entry.image_url || null, response_items: entry.response_items
        }];
      });
    }

    function hasOnlySystem(messages) {
      return messages.length === 1 && messages[0].id === 0;
    }

    async function submitMessages() {
      const messages = getSelectedMessages();
      if (hasOnlySystem(messages) && !confirm('只選了 System 訊息，確定要送出嗎？')) return;
      const response = await fetch(`/api/chat/${encodeURIComponent(chatid)}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(messages)
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      alert('Messages submitted successfully!');
      location.reload();
    }

    async function newMessages() {
      const messages = getSelectedMessages();
      if (hasOnlySystem(messages)) { alert('請至少選取一則對話。'); return; }
      const name = prompt('Please enter the chat name:');
      if (name === null) return;
      if (!name.trim()) { alert('Chat name cannot be empty.'); return; }
      let nextId = 0;
      const reindexed = messages.map(entry => ({
        ...entry, id: entry.system !== undefined ? 0 : ++nextId
      }));
      const response = await fetch('/api/chat/new', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, chatid, message: reindexed, lastid: reindexed.at(-1)?.id ?? 0 })
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      alert('Messages submitted successfully!');
    }

    async function runAction(action) {
      submitButton.disabled = newButton.disabled = true;
      try { await action(); }
      catch (error) { alert(`操作失敗：${error.message}`); }
      finally { submitButton.disabled = newButton.disabled = false; }
    }
    submitButton.addEventListener('click', () => runAction(submitMessages));
    newButton.addEventListener('click', () => runAction(newMessages));

    fetch(`/api/chatlog/${encodeURIComponent(chatid)}`)
      .then(response => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); })
      .then(data => {
        if (!Array.isArray(data)) throw new Error('聊天紀錄格式不正確');
        entries = data;
        render();
        container.lastElementChild?.scrollIntoView({ block: 'start' });
      })
      .catch(error => { container.textContent = `無法載入聊天紀錄：${error.message}`; });
  </script>
</body>
</html>
