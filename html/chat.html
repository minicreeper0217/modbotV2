<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=0.9">
	<title>Chat Log | modbot</title>
	<link rel="apple-touch-icon" sizes="120x120" href="/favicon/apple-touch-icon.png">
	<link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.js" nonce="{{ nonce }}"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js" nonce="{{ nonce }}"></script>
	<style>
		body {
			display: flex;
			justify-content: center;
			align-items: flex-start;
			height: 100vh;
			margin: 0;
			background-color: #f0f0f0;
			color: black;
			margin-top: 100px;
			font-family: 'Microsoft JhengHei', sans-serif;
			overflow-x: hidden;
		}
		#conversationContainer {
			max-width: 800px;
			width: 100%;
			box-sizing: border-box;
			overflow-x: hidden;
		}
		.conversation {
			border: 1px solid #ccc;
			margin-bottom: 18px;
			padding: 10px;
			border-radius: 6px;
			position: relative;
			background-color: #fff;
		}
		.conversation p {
			margin: 8px 0;
			line-height: 1.6;
		}
		.conversation h1, .conversation h2, .conversation h3 {
			margin: 12px 0 6px;
		}
		.conversation ul {
			padding-left: 20px;
		}
		.conversation li {
			margin: 4px 0;
		}
		.conversation blockquote {
			border-left: 4px solid #ccc;
			margin: 8px 0;
			padding: 6px 12px;
			background-color: #f9f9f9;
			color: #555;
		}
		.conversation table {
			width: 100%;
			border-collapse: collapse;
			margin: 10px 0;
			font-size: 0.95em;
		}
		.conversation th, .conversation td {
			border: 1px solid #ccc;
			padding: 6px 10px;
			text-align: left;
		}
		.conversation th {
			background-color: #f5f5f5;
			font-weight: bold;
		}
		.conversation pre {
			overflow-x: auto;
			padding: 10px;
			background-color: #f5f5f5;
			border-radius: 6px;
			margin: 10px 0;
		}
		.conversation.editing {
			border-color: #5865f2;
			box-shadow: 0 0 0 2px rgba(88, 101, 242, 0.2);
		}
		.conversation.editing .modelInfo {
			display: none;
		}
		.conversation.editing .editButton {
			opacity: 0.5;
			pointer-events: none;
		}
		.role-label {
			font-weight: bold;
			margin-bottom: 4px;
		}
		.message-content {
			line-height: 1.6;
			word-break: break-word;
			overflow-wrap: break-word;
		}
		button:disabled {
			opacity: 0.5;
			pointer-events: none;
		}
		.editButton {
			cursor: pointer;
			color: #fff;
			border: none;
			padding: 5px 10px;
			border-radius: 5px;
			position: absolute;
			top: 8px;
		}
		.editAssistantButton {
			background-color: #5865f2;
			right: 0.5rem;
		}
		.editUserButton {
			background-color: #4e5058;
			right: 8rem;
		}
		.editSystemButton {
			background-color: #248045;
			right: 0.5rem;
		}
		.edit-container {
			margin-top: 6px;
		}
		.edit-textarea {
			width: 100%;
			max-width: 100%;
			min-height: 80px;
			max-height: 50vh;
			font-size: 16px;
			padding: 8px;
			border-radius: 6px;
			border: 1px solid #ccc;
			box-sizing: border-box;
		}
		.edit-textarea:focus {
			outline: none;
			border-color: #5865f2;
		}
		.edit-actions {
			margin-top: 6px;
			display: flex;
			gap: 8px;
		}
		.edit-save {
			background-color: #248046;
			color: white;
			border: none;
			padding: 6px 12px;
			border-radius: 5px;
			cursor: pointer;
		}
		.edit-cancel {
			background-color: #da373c;
			color: white;
			border: none;
			padding: 6px 12px;
			border-radius: 5px;
			cursor: pointer;
		}
		.logo {
			position: absolute;
			top: 10px;
			left: 10px;
			font-weight: bold;
			margin-top: 20px;
			margin-left: 25px;
			font-size: 22px;
			text-decoration: none;
			color: #000;
		}
		.id {
			font-weight: bold;
			font-size: 18px;
			position: relative;
			left: 30px;
		}
		.checkbox {
			transform: scale(1.2);
			position: absolute;
			top: 13px;
		}
		.modelInfo {
			position: absolute;
			right: 14rem;
			top: 6px;
			background-color: #f0f0f0;
			padding: 5px 10px;
			border-radius: 5px;
			font-size: 14px;
		}
		#submitBtn {
			background-color: #248046;
			color: #fff;
			border: none;
			padding: 10px 20px;
			border-radius: 5px;
			cursor: pointer;
			position: absolute;
			top: 10px;
			right: 10px;
			margin-top: 20px;
			margin-right: 25px;
		}
		#newBtn {
			background-color: #DA373C;
			color: #fff;
			border: none;
			padding: 10px 20px;
			border-radius: 5px;
			cursor: pointer;
			position: absolute;
			top: 10px;
			right: 90px;
			margin-top: 20px;
			margin-right: 25px;
		}
		.reasoning-toggle {
			margin-top: 8px;
			padding: 6px 10px;
			border-radius: 5px;
			border: none;
			cursor: pointer;
			color: #000;
			background-color: #e0e0e0;
		}
		.reasoning-toggle:hover {
			background-color: #d5d5d5;
		}
		.reasoning-box {
			display: none;
			margin-top: 8px;
			margin-bottom: 8px;
			padding: 10px;
			background-color: #f5f5f5;
			border-radius: 5px;
			font-size: 0.9em;
			max-height: 200px;
			overflow-y: auto;
		}
		.reasoning-box.show {
			display: block;
		}
		.conversation .code-block pre {
			color: #0d0d0d;
		}
		.conversation .hljs-keyword {
			color: #ab4f7a;
		}
		.conversation .hljs-string {
			color: #3a843f;
		}
		.conversation .hljs-number {
			color: #ac4f23;
		}
		.conversation .hljs-built_in,
		.conversation .hljs-title {
			color: #643cae;
		}
		.conversation .hljs-comment {
			color: #586069;
		}
		.conversation .code-block {
			margin: 10px 0;
			border-radius: 6px;
			overflow: hidden;
		}
		.conversation .code-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 6px 10px;
			background-color: #e5e5e5;
			font-family: monospace;
			font-size: 13px;
		}
		.conversation .copy-code-btn {
			border: none;
			background: transparent;
			color: inherit;
			cursor: pointer;
		}
		.conversation .copy-code-btn:hover {
			text-decoration: underline;
		}
		.conversation .code-block pre {
			margin: 0;
			border-radius: 0;
		}
		@media (prefers-color-scheme: dark) {
			body {
				background-color: #1f1f1f;
				color: white;
			}
			.conversation {
				background-color: #000;
			}
			.conversation blockquote {
				border-left: 4px solid #555;
				background-color: #1a1a1a;
				color: #ccc;
			}
			.conversation th, .conversation td {
				border: 1px solid #555;
			}
			.conversation th {
				background-color: #1a1a1a;
			}
			.conversation pre {
				background-color: #1a1a1a;
			}
			.logo {
				color: white;
			}
			.modelInfo {
				background-color: #1f1f1f;
			}
			.edit-textarea {
				background-color: #2a2a2a;
				color: white;
			}
			.reasoning-toggle {
				background-color: #2a2a2a;
				color: white;
			}
			.reasoning-toggle:hover {
				background-color: #3a3a3a;
			}
			.reasoning-box {
				background-color: #1a1a1a;
			}
			.conversation .hljs-keyword {
				color: #ff7b72;
			}
			.conversation .hljs-string {
				color: #a5d6ff;
			}
			.conversation .hljs-number,
			.conversation .hljs-built_in {
				color: #79c0ff;
			}
			.conversation .hljs-comment {
				color: #8b949e;
			}
			.conversation .hljs-title {
				color: #d2a8ff;
			}
		}
		@media (max-width: 768px) {
			.modelInfo {
				right: 12rem;
				max-width: 25%;
				font-size: 12px;
			}
			.editUserButton {
				right: 7rem;
			}
		}
		/* 只新增工具紀錄專用樣式；原本按鈕與頁面配置不變。 */
		.tool-event {
			margin: 10px 0;
			padding: 8px;
			border: 1px solid #ccc;
			border-radius: 5px;
		}
		.tool-event summary {
			cursor: pointer;
			font-weight: bold;
			overflow-wrap: anywhere;
		}
		.tool-event pre {
			white-space: pre-wrap;
			overflow-wrap: anywhere;
			max-height: 240px;
			overflow: auto;
			font-size: 13px;
		}
		.tool-call {
			margin-top: 10px;
			padding: 8px;
			border-left: 3px solid #5865f2;
		}
		.tool-name {
			font-weight: bold;
			font-family: monospace;
			overflow-wrap: anywhere;
		}
		.tool-label {
			margin: 8px 0 4px;
			font-size: 13px;
		}
	</style>
</head>
<body>

<a class="logo" href="/">modbot.dev</a>
<div id="conversationContainer"></div>
<button id="submitBtn">送出</button>
<button id="newBtn">複製</button>

<script nonce="{{ nonce }}">
const chatid = window.location.pathname.split('/').pop();
const md = window.markdownit({
	highlight(code, language) {
		if (!window.hljs || !language || !window.hljs.getLanguage(language)) {
			return ''; // 沒標語言或套件沒載入時，交回 markdown-it 安全地顯示原文
		}
		try {
			return window.hljs.highlight(code, {
				language,
				ignoreIllegals: true
			}).value;
		} catch {
			return '';
		}
	}
});
md.renderer.rules.fence = (tokens, index, options) => {
	const token = tokens[index];
	const language = token.info.trim().split(/\s+/)[0] || 'text';
	const safeLanguage = md.utils.escapeHtml(language);
	const highlighted = options.highlight(token.content, language);
	const codeHtml = highlighted || md.utils.escapeHtml(token.content);

	return `<div class="code-block">
		<div class="code-header">
			<span>${safeLanguage}</span>
			<button type="button" class="copy-code-btn">複製</button>
		</div>
		<pre><code class="hljs language-${safeLanguage}">${codeHtml}</code></pre>
	</div>`;
};
let editingState = null;
fetch(`/api/chatlog/${chatid}`)
.then(response => response.json())
.then(data => {
	const json = data;
	const conversationContainer = document.getElementById('conversationContainer');
	let shouldScrollToBottom = false;

	function readable(value) {
		if (value === '(deleted)') return '（內容已刪除）';
		if (typeof value !== 'string') return JSON.stringify(value ?? null, null, 2);
		try {
			return JSON.stringify(JSON.parse(value), null, 2);
		} catch {
			return value;
		}
	}

	function toolArguments(call) {
		if (call.name !== 'save_file') return readable(call.arguments);
		try {
			const args = JSON.parse(call.arguments);
			if (args && typeof args === 'object' && 'content' in args) args.content = '（檔案內容已隱藏）';
			return JSON.stringify(args, null, 2);
		} catch {
			return '（參數格式無法解析，已隱藏）';
		}
	}

	function toolOutput(name, output) {
		if (name !== 'github_read_file') return readable(output);
		if (output === '(deleted)') return '（內容已刪除）';
		try {
			const result = typeof output === 'string' ? JSON.parse(output) : output;
			if (!result || typeof result !== 'object' || Array.isArray(result)) return '（結果格式無法解析，已隱藏）';
			return JSON.stringify({ ...result, ...('content' in result ? { content: '（檔案內容已隱藏）' } : {}) }, null, 2);
		} catch {
			return '（結果格式無法解析，已隱藏）';
		}
	}

	function toolGroup(calls, outputs) {
		const details = document.createElement('details');
		details.classList.add('tool-event');
		const summary = document.createElement('summary');
		summary.textContent = `${calls.length} 個工具呼叫`;
		details.appendChild(summary);
		calls.forEach((call, index) => {
			const block = document.createElement('section');
			block.classList.add('tool-call');
			const name = document.createElement('div');
			name.classList.add('tool-name');
			name.textContent = `${index + 1}. ${call.name || '未知工具'}`;
			block.appendChild(name);
			const result = outputs.get(call.call_id);
			const fields = [
				['參數', toolArguments(call)],
				['結果', result === undefined ? '沒有找到對應的工具結果' : toolOutput(call.name, result)]
			];
			for (const [label, text] of fields) {
				const heading = document.createElement('div');
				heading.classList.add('tool-label');
				heading.textContent = label;
				const pre = document.createElement('pre');
				pre.textContent = text; // 不把工具資料當 HTML 執行
				block.append(heading, pre);
			}
			details.appendChild(block);
		});
		return details;
	}

	function messageBlock(text) {
		const block = document.createElement('div');
		const title = document.createElement('div');
		title.classList.add('role-label');
		title.textContent = '[Assistant]';
		const content = document.createElement('div');
		content.classList.add('message-content');
		content.innerHTML = md.render(text);
		block.append(title, content);
		return block;
	}

	function messageText(item) {
		if (!Array.isArray(item.content)) return '';
		return item.content.filter(part => part && part.type === 'output_text' && typeof part.text === 'string')
			.map(part => part.text).join('');
	}

	function renderAssistantTimeline(entry, index, container) {
		const items = Array.isArray(entry.response_items) ? entry.response_items : [];
		const hasCalls = items.some(item => item && item.type === 'function_call');
		if (!hasCalls) {
			container.appendChild(renderEditableBlock(entry, index, 'assistant', 'Assistant'));
			return;
		}
		// 有工具呼叫時，助理文字來自 response_items；編輯功能會被停用。
		const outputs = new Map(items.filter(item => item && item.type === 'function_call_output' && item.call_id != null)
			.map(item => [item.call_id, item.output]));
		let pendingCalls = [];
		let recordedText = '';
		function flushCalls() {
			if (pendingCalls.length) {
				container.appendChild(toolGroup(pendingCalls, outputs));
				pendingCalls = [];
			}
		}
		for (const item of items) {
			if (!item) continue;
			if (item.type === 'function_call') pendingCalls.push(item);
			else if (item.type === 'message' && (item.role === 'assistant' || !item.role)) {
				const text = messageText(item);
				if (text) {
					flushCalls();
					recordedText += text;
					container.appendChild(messageBlock(text));
				}
			}
		}
		flushCalls();
		const full = typeof entry.assistant === 'string' ? entry.assistant : '';
		// assistant 是整段文字。只補上 response_items 未記錄的部分，不重複顯示。
		if (!recordedText) container.appendChild(messageBlock(full));
		else if (full.startsWith(recordedText) && full.length > recordedText.length) {
			container.appendChild(messageBlock(full.slice(recordedText.length)));
		}
	}

	function createConversation(entry, index) {
		const conversationDiv = document.createElement('div');
		conversationDiv.classList.add('conversation');
		if (editingState && editingState.index === index) conversationDiv.classList.add('editing');
		if (entry.id === 0) {
			conversationDiv.appendChild(renderEditableBlock(entry, index, 'system', 'System'));
			const editSystemButton = document.createElement('button');
			editSystemButton.textContent = 'Edit System Message';
			editSystemButton.classList.add('editButton', 'editSystemButton');
			editSystemButton.addEventListener('click', () => startEdit(entry, index, 'system'));
			conversationDiv.appendChild(editSystemButton);
		} else {
			const idDiv = document.createElement('div');
			idDiv.textContent = entry.id.toString();
			idDiv.classList.add('id');
			conversationDiv.appendChild(idDiv);
			const checkbox = document.createElement('input');
			checkbox.type = 'checkbox';
			checkbox.checked = true;
			checkbox.classList.add('checkbox');
			conversationDiv.appendChild(checkbox);
			conversationDiv.appendChild(renderEditableBlock(entry, index, 'user', 'User'));
			if (entry.image_url) {
				const imageDiv = document.createElement('div');
				const image = document.createElement('img');
				image.src = '/api/chat-images/' + entry.image_url;
				image.alt = 'User provided image';
				image.style.maxWidth = '100%';
				imageDiv.appendChild(image);
				conversationDiv.appendChild(imageDiv);
			}
			if (entry.reasoning) {
				const toggleBtn = document.createElement('button');
				toggleBtn.textContent = '查看思考';
				toggleBtn.classList.add('reasoning-toggle');
				const reasoningDiv = document.createElement('div');
				reasoningDiv.classList.add('reasoning-box');
				reasoningDiv.innerHTML = md.render(entry.reasoning);
				toggleBtn.addEventListener('click', () => {
					reasoningDiv.classList.toggle('show');
					toggleBtn.textContent = reasoningDiv.classList.contains('show') ? '隱藏思考' : '查看思考';
				});
				conversationDiv.append(toggleBtn, reasoningDiv);
			}
			renderAssistantTimeline(entry, index, conversationDiv);
			if (entry.model) {
				const modelDiv = document.createElement('div');
				modelDiv.textContent = entry.model;
				modelDiv.classList.add('modelInfo');
				conversationDiv.appendChild(modelDiv);
			}
			const editUserButton = document.createElement('button');
			editUserButton.textContent = 'Edit User';
			editUserButton.classList.add('editButton', 'editUserButton');
			editUserButton.addEventListener('click', () => startEdit(entry, index, 'user'));
			conversationDiv.appendChild(editUserButton);
			const editAssistantButton = document.createElement('button');
			editAssistantButton.textContent = 'Edit Assistant';
			editAssistantButton.classList.add('editButton', 'editAssistantButton');
			// 防止修改 assistant 後與分段的 response_items 不一致。
			editAssistantButton.disabled = Array.isArray(entry.response_items) &&
				entry.response_items.some(item => item && item.type === 'function_call');
			if (editAssistantButton.disabled) editAssistantButton.title = '此對話有工具呼叫，無法編輯助理訊息';
			editAssistantButton.addEventListener('click', () => startEdit(entry, index, 'assistant'));
			conversationDiv.appendChild(editAssistantButton);
		}
		conversationContainer.appendChild(conversationDiv);
	}

	function startEdit(entry, index, field) {
		if (field === 'assistant' && index === json.length - 1) shouldScrollToBottom = true;
		editingState = { index, field, value: cleanText(entry[field]) };
		updateConversation();
	}

	function renderEditableBlock(entry, index, field, label) {
		const container = document.createElement('div');
		if (editingState && editingState.index === index && editingState.field === field) {
			container.classList.add('edit-container');
			const labelDiv = document.createElement('div');
			labelDiv.classList.add('role-label');
			labelDiv.textContent = `[${label}]`;
			const textarea = document.createElement('textarea');
			textarea.classList.add('edit-textarea');
			textarea.value = editingState.value;
			autoResizeTextarea(textarea);
			textarea.addEventListener('input', () => autoResizeTextarea(textarea));
			const actions = document.createElement('div');
			actions.classList.add('edit-actions');
			const saveBtn = document.createElement('button');
			saveBtn.textContent = '儲存';
			saveBtn.classList.add('edit-save');
			const cancelBtn = document.createElement('button');
			cancelBtn.textContent = '取消';
			cancelBtn.classList.add('edit-cancel');
			saveBtn.addEventListener('click', () => { entry[field] = textarea.value; editingState = null; updateConversation(); });
			cancelBtn.addEventListener('click', () => { editingState = null; updateConversation(); });
			actions.append(saveBtn, cancelBtn);
			container.append(labelDiv, textarea, actions);
			setTimeout(() => autoResizeTextarea(textarea), 0);
		} else {
			container.innerHTML = `<div class="role-label">[${label}]</div><div class="message-content">${md.render(entry[field] || '')}</div>`;
		}
		return container;
	}

	function autoResizeTextarea(textarea) {
		textarea.style.height = 'auto';
		textarea.style.height = textarea.scrollHeight + 'px';
	}

	function scrollToLastConversation() {
		const conversations = document.querySelectorAll('.conversation');
		if (conversations.length) conversations[conversations.length - 1].scrollIntoView({ behavior: 'auto', block: 'start' });
	}

	function cleanText(text) {
		return text ? text.replace(/^\n+/, '') : '';
	}

	function updateConversation() {
		const checkboxStates = Array.from(document.querySelectorAll('.checkbox')).map(checkbox => checkbox.checked);
		conversationContainer.innerHTML = '';
		json.forEach((entry, i) => createConversation(entry, i));
		if (shouldScrollToBottom) {
			requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'auto' }));
			shouldScrollToBottom = false;
		}
		document.querySelectorAll('.checkbox').forEach((checkbox, i) => { checkbox.checked = checkboxStates[i] ?? true; });
	}

	function getSelectedMessages() {
		const selectedMessages = [];
		const conversationDivs = document.querySelectorAll('.conversation');
		json.forEach((entry, i) => {
			if (entry.id === 0) selectedMessages.push({ id: entry.id, system: entry.system });
			else if (conversationDivs[i].querySelector('.checkbox')?.checked) selectedMessages.push({
				id: entry.id, user: entry.user, assistant: cleanText(entry.assistant),
				reasoning: entry.reasoning || null, model: entry.model || null,
				image_url: entry.image_url || null, response_items: entry.response_items
			});
		});
		return selectedMessages;
	}

	function submitMessages() {
		const selectedMessages = getSelectedMessages();
		if (selectedMessages.length === 1 && selectedMessages[0].id === 0 &&
			!confirm("You haven't selected any messages except the system message. Do you want to continue?")) return;
		fetch(`/api/chat/${chatid}`, {
			method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(selectedMessages)
		}).then(response => {
			if (response.status === 204) { alert('Messages submitted successfully!'); location.reload(); }
			else alert(`Error submitting messages. (${response.status})`);
		}).catch(error => alert(`Error submitting messages. (${error})`));
	}

	function newMessages() {
		const selectedMessages = getSelectedMessages();
		if (selectedMessages.length === 1 && selectedMessages[0].id === 0) {
			alert('Selected message cannot be empty except the system message.'); return;
		}
		const chatName = prompt('Please enter the chat name:');
		if (chatName === null) return;
		if (!chatName) { alert('Chat name cannot be empty. Please try again.'); return; }
		const newJson = reindexMessages(selectedMessages);
		const postData = { name: chatName, chatid, message: newJson, lastid: newJson[newJson.length - 1].id };
		fetch('/api/chat/new', {
			method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(postData)
		}).then(response => {
			if (response.status === 204) alert('Messages submitted successfully!');
			else alert(`Error submitting messages. (${response.status})`);
		}).catch(error => alert(`Error submitting messages. (${error})`));
	}

	function reindexMessages(messages) {
		let newIndex = 0;
		return messages.map(entry => entry.system !== undefined ? { ...entry, id: 0 } : { ...entry, id: ++newIndex });
	}

	json.forEach((entry, index) => { createConversation(entry, index); scrollToLastConversation(); });
	const submitButton = document.getElementById('submitBtn');
	const newButton = document.getElementById('newBtn');
	submitButton.addEventListener('click', async () => {
		if (submitButton.disabled) return;
		submitButton.disabled = newButton.disabled = true;
		await new Promise(r => setTimeout(r, 40));
		try { await submitMessages(); }
		finally { await new Promise(r => setTimeout(r, 1000)); submitButton.disabled = newButton.disabled = false; }
	});
	newButton.addEventListener('click', async () => {
		if (newButton.disabled) return;
		newButton.disabled = submitButton.disabled = true;
		await new Promise(r => setTimeout(r, 40));
		try { await newMessages(); }
		finally { newButton.disabled = submitButton.disabled = false; }
	});
	conversationContainer.addEventListener('click', async event => {
		const button = event.target.closest('.copy-code-btn');
		if (!button) return;

		const code = button.closest('.code-block')?.querySelector('code');
		if (!code) return;

		try {
			await navigator.clipboard.writeText(code.textContent);
			button.textContent = '已複製！';
			setTimeout(() => { button.textContent = '複製'; }, 1500);
		} catch {
			button.textContent = '複製失敗';
			setTimeout(() => { button.textContent = '複製'; }, 1500);
		}
	});
}).catch(error => alert(`Error fetching chat log. (${error.status})`));
</script>

</body>
</html>
