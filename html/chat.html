<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Chat Log | modbot</title>
	<link rel="apple-touch-icon" sizes="120x120" href="/favicon/apple-touch-icon.png">
	<link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
	<!--<script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.js" nonce="{{ nonce }}"></script>-->
	<script src="https://cdn.jsdelivr.net/npm/markdown-it@15.0.3/dist/browser/markdown-it.umd.min.js" nonce="{{ nonce }}"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js" nonce="{{ nonce }}"></script>
	<style>
		:root {
			color-scheme: light dark;
			--page: #f5f6f8; --surface: #fff; --surface-soft: #f7f8fb;
			--surface-hover: #eef0f5; --text: #202330; --muted: #565e70;
			--border: #dce0e8; --accent: #5865f2; --accent-soft: rgba(88, 101, 242, .12);
			--code-head: #e9ebf1; --code-text: #0d0d0d;
			--shadow: 0 3px 16px rgba(30, 38, 56, .045);
		}
		* { box-sizing: border-box; }
		body {
			margin: 0; background: var(--page); color: var(--text);
			font-family: 'Microsoft JhengHei', system-ui, sans-serif; line-height: 1.6;
		}
		.page-header {
			width: 100%; min-height: 72px;
			padding: 14px max(20px, calc((100vw - 960px) / 2));
			display: flex; align-items: center; justify-content: space-between; gap: 16px;
			background: var(--surface); border-bottom: 1px solid var(--border);
		}
		.logo { color: var(--text); font-size: 21px; font-weight: 750; text-decoration: none; white-space: nowrap; }
		.page-actions { display: flex; align-items: center; gap: 9px; }
		button { font: inherit; }
		button:disabled { opacity: .5; cursor: not-allowed !important; }
		.action-button, .editButton, .edit-save, .edit-cancel {
			border: 1px solid transparent; border-radius: 8px; cursor: pointer; font-weight: 600;
		}
		.action-button { min-height: 40px; padding: 7px 18px; color: #fff; }
		#submitBtn { background: #248046; }
		#newBtn { background: #b63137; }
		#conversationContainer {
			width: min(100% - 40px, 860px); margin: 28px auto 64px; min-width: 0;
		}
		.conversation {
			min-width: 0; margin-bottom: 20px; background: var(--surface);
			border: 1px solid var(--border); border-radius: 14px;
			box-shadow: var(--shadow); overflow: hidden;
		}
		.conversation.editing { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
		.conversation-header {
			display: flex; align-items: center; justify-content: space-between;
			gap: 10px 16px; min-width: 0; padding: 14px 20px;
			background: var(--surface-soft); border-bottom: 1px solid var(--border);
		}
		.conversation-identity { display: flex; align-items: center; gap: 12px; min-width: 0; font-weight: 700; }
		.select-conversation { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
		.checkbox { width: 18px; height: 18px; margin: 0; flex: none; accent-color: var(--accent); cursor: pointer; }
		.id { overflow-wrap: anywhere; }
		.modelInfo {
			min-width: 0; max-width: 55%; padding: 3px 10px;
			border: 1px solid var(--border); border-radius: 999px;
			color: var(--muted); font-size: 13px; font-weight: 500;
			overflow-wrap: anywhere; text-align: right;
		}
		.conversation.editing .modelInfo { display: none; }
		.message-section { min-width: 0; padding: 20px 24px; }
		.message-section + .message-section { border-top: 1px solid var(--border); }
		.section-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
		.role-label { color: var(--muted); font-size: 13px; font-weight: 750; letter-spacing: .04em; }
		.message-body { min-width: 0; }
		.message-content { min-width: 0; line-height: 1.7; overflow-wrap: anywhere; }
		.message-content > :first-child, .reasoning-box > :first-child { margin-top: 0; }
		.message-content > :last-child, .reasoning-box > :last-child { margin-bottom: 0; }
		.message-content p, .reasoning-box p { margin: 8px 0; }
		.message-content h1, .message-content h2, .message-content h3 { margin: 16px 0 8px; line-height: 1.35; }
		.message-content ul, .reasoning-box ul { padding-left: 22px; }
		.message-content li, .reasoning-box li { margin: 4px 0; }
		.message-content blockquote, .reasoning-box blockquote {
			border-left: 3px solid var(--border); margin: 12px 0; padding: 6px 14px;
			background: var(--surface-soft); color: var(--muted);
		}
		.message-content code:not(pre code),
		.reasoning-box code:not(pre code) {
			padding: 2px 5px;
			border-radius: 4px;
			background: var(--code-head);
			font-size: 0.9em;
		}
		/* 讓任意 Markdown 表格有可閱讀的欄寬；長內容適度換行，超寬只捲動表格。 */
		.table-scroll { max-width: 100%; overflow-x: auto; margin: 12px 0; }
		.table-scroll table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: .95em; }
		.table-scroll th, .table-scroll td {
			min-width: 120px; max-width: 260px; padding: 8px 12px;
			border: 1px solid var(--border); text-align: left; vertical-align: top;
			white-space: normal; word-break: normal; overflow-wrap: anywhere;
		}
		.table-scroll th { background: var(--surface-soft); }
		.message-content pre, .reasoning-box pre, .tool-event pre {
			max-width: 100%; overflow: auto; padding: 12px;
			background: var(--surface-soft); border-radius: 8px;
		}
		.editButton {
			flex: none; min-height: 36px; padding: 5px 12px;
			background: var(--surface-soft); color: var(--text); border-color: var(--border);
		}
		.editButton:hover:not(:disabled), .reasoning-toggle:hover { background: var(--surface-hover); }
		.conversation.editing .editButton { opacity: .5; pointer-events: none; }
		.edit-container { min-width: 0; }
		.edit-textarea {
			width: 100%; min-height: 90px; max-height: 50vh;
			padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
			background: var(--surface); color: var(--text); font: inherit; font-size: 16px;
			resize: vertical;
		}
		.edit-textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
		.edit-actions { display: flex; gap: 8px; margin-top: 10px; }
		.edit-save, .edit-cancel { min-height: 40px; padding: 7px 16px; color: white; }
		.edit-save { background: #248046; }
		.edit-cancel { background: #b63137; }
		.user-image { display: block; max-width: 100%; height: auto; margin-top: 14px; border-radius: 8px; }
		.file-attachment {
			display: flex; align-items: center; gap: 12px;
			width: fit-content; max-width: 100%; min-width: 0;
			margin-top: 14px; padding: 11px 14px;
			border: 1px solid var(--border); border-radius: 10px;
			background: var(--surface-soft);
		}
		.file-icon { flex: none; font-size: 23px; line-height: 1; }
		.file-details { min-width: 0; }
		.file-name { font-weight: 650; overflow-wrap: anywhere; }
		.file-type { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
		.reasoning-toggle {
			margin: 0 0 10px; padding: 8px 12px;
			border: 1px solid var(--border); border-radius: 8px;
			background: var(--surface-soft); color: var(--text); cursor: pointer;
		}
		.reasoning-box {
			display: none; max-height: 240px; overflow-y: auto;
			margin: 0 0 14px; padding: 14px;
			border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
			background: var(--surface-soft); font-size: .92em;
		}
		.reasoning-box.show { display: block; }
		.timeline-message + .timeline-message, .timeline-message + .tool-event,
		.tool-event + .timeline-message, .tool-event + .tool-event { margin-top: 16px; }
		.code-block { max-width: 100%; margin: 12px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
		.code-header {
			display: flex; align-items: center; justify-content: space-between; gap: 12px;
			padding: 7px 12px; background: var(--code-head); font-family: monospace; font-size: 13px;
		}
		.copy-code-btn { border: none; background: transparent; color: inherit; cursor: pointer; }
		.copy-code-btn:hover { text-decoration: underline; }
		.message-content .code-block pre, .reasoning-box .code-block pre {
			margin: 0; border-radius: 0; color: var(--code-text); overflow-x: auto;
		}
		.hljs-keyword { color: #ab4f7a; }
		.hljs-string { color: #3a843f; }
		.hljs-number { color: #ac4f23; }
		.hljs-built_in, .hljs-title { color: #643cae; }
		.hljs-comment { color: #586069; }
		.tool-event {
			padding: 10px 12px; border: 1px solid var(--border);
			border-radius: 8px; background: var(--surface-soft);
		}
		.tool-event summary { cursor: pointer; font-weight: 650; overflow-wrap: anywhere; }
		.tool-event[open] summary { margin-bottom: 10px; }
		.tool-call { min-width: 0; margin-top: 10px; padding: 8px 0 8px 12px; border-left: 3px solid var(--accent); }
		.tool-name { font-weight: 650; font-family: monospace; overflow-wrap: anywhere; }
		.tool-label { margin: 8px 0 4px; color: var(--muted); font-size: 13px; }
		.tool-event pre { max-height: 240px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
		:where(button, a, input, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
		@media (prefers-color-scheme: dark) {
			:root {
				--page: #171a20; --surface: #23272f; --surface-soft: #2a303a;
				--surface-hover: #343d49; --text: #f1f3f7; --muted: #b9c1cf;
				--border: #414956; --accent: #9ba5ff; --accent-soft: rgba(155, 165, 255, .22);
				--code-head: #343c47; --code-text: #f1f3f7;
				--shadow: 0 3px 16px rgba(0, 0, 0, .12);
			}
			.hljs-keyword { color: #ff7b72; }
			.hljs-string { color: #a5d6ff; }
			.hljs-number, .hljs-built_in { color: #79c0ff; }
			.hljs-comment { color: #9aa6b4; }
			.hljs-title { color: #d2a8ff; }
		}
		@media (max-width: 600px) {
			.page-header { padding: 12px 16px; flex-wrap: wrap; min-height: 0; }
			.page-actions { width: 100%; justify-content: flex-end; }
			.action-button { min-height: 44px; }
			#conversationContainer { width: calc(100% - 24px); margin: 16px auto 40px; }
			.conversation { margin-bottom: 14px; border-radius: 12px; }
			.conversation-header { padding: 12px 16px; flex-wrap: wrap; }
			.conversation-identity { flex: 0 0 auto; }
			.modelInfo {
					flex: 0 1 auto;
					max-width: 55%;
					margin-left: auto;
					text-align: right;
			}
			.message-section { padding: 16px; }
			.editButton { min-height: 44px; }
			.file-attachment { width: 100%; }
			.edit-save, .edit-cancel { min-height: 44px; }
		}
		@media (max-width: 400px) {
			.section-header { flex-wrap: wrap; }
		}
	</style>
</head>
<body>
<header class="page-header">
	<a class="logo" href="/">modbot.dev</a>
	<div class="page-actions">
		<button id="newBtn" class="action-button" type="button">複製</button>
		<button id="submitBtn" class="action-button" type="button">送出</button>
	</div>
</header>
<main id="conversationContainer" aria-label="對話紀錄"></main>

<script nonce="{{ nonce }}">
const chatid = window.location.pathname.split('/').pop();
const md = window.markdownit({
    highlight(code, language) {
        if (!window.hljs || !language || !window.hljs.getLanguage(language)) {
            return '';
        }
        try {
            return window.hljs.highlight(code, {
                language,
                ignoreIllegals: true
            }).value;
        } catch {
            return '';
        }
    }
});
md.renderer.rules.fence = (tokens, index, options) => {
	const token = tokens[index];
	const language = token.info.trim().split(/\s+/)[0] || 'text';
	const safeLanguage = md.utils.escapeHtml(language);
	const highlighted = options.highlight(token.content, language);
	const codeHtml = highlighted || md.utils.escapeHtml(token.content);
	return `<div class="code-block">
		<div class="code-header">
			<span>${safeLanguage}</span>
			<button type="button" class="copy-code-btn">複製</button>
		</div>
		<pre><code class="hljs language-${safeLanguage}">${codeHtml}</code></pre>
	</div>`;
};
// 只保留使用者原文中的單行換行；助理與思考內容仍使用原本的 Markdown 行為。
const userMd = window.markdownit({
    breaks: true,
    highlight: md.options.highlight
});
userMd.renderer.rules.fence = md.renderer.rules.fence;
let editingState = null;
fetch(`/api/chatlog/${chatid}`)
.then(response => response.json())
.then(data => {
	const json = Array.isArray(data) ? data.filter(entry => entry && typeof entry === 'object') : [];
	const conversationContainer = document.getElementById('conversationContainer');
	let shouldScrollToBottom = false;
	const textValue = value => typeof value === 'string' ? value : '';

	
	function fixChineseBold(text) {
    const lines = text.split('\n');
    let fence = null;

    return lines.map(line => {
        const match = line.match(/^\s{0,3}(`{3,}|~{3,})/);

        // 程式碼區塊內的內容完全不修改
        if (fence) {
            const close = new RegExp(
                '^\\s{0,3}' + fence.char +
                '{' + fence.length + ',}\\s*$'
            );

            if (close.test(line)) fence = null;
            return line;
        }

        if (match) {
            fence = {
                char: match[1][0],
                length: match[1].length
            };
            return line;
        }

        // 暫時保護行內程式碼，避免修改裡面的 **
        const inlineCode = [];
        const protectedLine = line.replace(/(`+).*?\1/g, code => {
            inlineCode.push(code);
            return `ZZZMDINLINECODE${inlineCode.length - 1}ZZZ`;
        });

        // 修正中文標點緊貼粗體結尾的情況
        const fixed = protectedLine.replace(
            /(\*\*[^*\n]+[，。！？；：、])(\*\*)/g,
            '$1\u200B$2'
        );

        // 還原行內程式碼
        return fixed.replace(
            /ZZZMDINLINECODE(\d+)ZZZ/g,
            (_, index) => inlineCode[Number(index)]
        );
    }).join('\n');
	}


	
	function renderMarkdown(target, text, renderer = md) {
    const source = renderer === md
        ? fixChineseBold(textValue(text))
        : textValue(text);

    target.innerHTML = renderer.render(source);

    // 移除本次修正插入的零寬空白
    const walker = document.createTreeWalker(
        target,
        NodeFilter.SHOW_TEXT
    );

    let node;
    while ((node = walker.nextNode())) {
        node.nodeValue = node.nodeValue.replace(
            /([，。！？；：、])\u200B/g,
            '$1'
        );
    }

    // 保留原本的表格捲動功能
    target.querySelectorAll('table').forEach(table => {
        const wrapper = document.createElement('div');
        wrapper.classList.add('table-scroll');
        table.replaceWith(wrapper);
        wrapper.appendChild(table);
    });
	}


	function readable(value) {
		if (value === '(deleted)') return '（內容已刪除）';
		if (typeof value !== 'string') return JSON.stringify(value ?? null, null, 2);
		try { return JSON.stringify(JSON.parse(value), null, 2); }
		catch { return value; }
	}

	function toolArguments(call) {
		if (call.name !== 'save_file') return readable(call.arguments);
		try {
			const args = JSON.parse(call.arguments);
			if (args && typeof args === 'object' && 'content' in args) args.content = '（檔案內容已隱藏）';
			return JSON.stringify(args, null, 2);
		} catch { return '（參數格式無法解析，已隱藏）'; }
	}

	function toolOutput(name, output) {
		if (name !== 'github_read_file') return readable(output);
		if (output === '(deleted)') return '（內容已刪除）';
		try {
			const result = typeof output === 'string' ? JSON.parse(output) : output;
			if (!result || typeof result !== 'object' || Array.isArray(result)) return '（結果格式無法解析，已隱藏）';
			return JSON.stringify({ ...result, ...('content' in result ? { content: '（檔案內容已隱藏）' } : {}) }, null, 2);
		} catch { return '（結果格式無法解析，已隱藏）'; }
	}

	function toolGroup(calls, outputs) {
		const details = document.createElement('details');
		details.classList.add('tool-event');
		const summary = document.createElement('summary');
		summary.textContent = `${calls.length} 個工具呼叫`;
		details.appendChild(summary);
		calls.forEach((call, index) => {
			const block = document.createElement('section');
			block.classList.add('tool-call');
			const name = document.createElement('div');
			name.classList.add('tool-name');
			name.textContent = `${index + 1}. ${call.name || '未知工具'}`;
			block.appendChild(name);
			const result = outputs.get(call.call_id);
			const fields = [
				['參數', toolArguments(call)],
				['結果', result === undefined ? '沒有找到對應的工具結果' : toolOutput(call.name, result)]
			];
			for (const [label, text] of fields) {
				const heading = document.createElement('div');
				heading.classList.add('tool-label');
				heading.textContent = label;
				const pre = document.createElement('pre');
				pre.textContent = text ?? '';
				block.append(heading, pre);
			}
			details.appendChild(block);
		});
		return details;
	}

	function messageBlock(text) {
		const block = document.createElement('div');
		block.classList.add('message-content', 'timeline-message');
		renderMarkdown(block, text);
		return block;
	}

	function messageText(item) {
		if (!Array.isArray(item.content)) return '';
		return item.content.filter(part => part && part.type === 'output_text' && typeof part.text === 'string')
			.map(part => part.text).join('');
	}

	function hasToolCalls(entry) {
		return Array.isArray(entry.response_items) &&
			entry.response_items.some(item => item && item.type === 'function_call');
	}

	function renderAssistantTimeline(entry, container) {
		const items = Array.isArray(entry.response_items) ? entry.response_items : [];
		const outputs = new Map(items.filter(item => item && item.type === 'function_call_output' && item.call_id != null)
			.map(item => [item.call_id, item.output]));
		let pendingCalls = [];
		let recordedText = '';
		function flushCalls() {
			if (pendingCalls.length) {
				container.appendChild(toolGroup(pendingCalls, outputs));
				pendingCalls = [];
			}
		}
		for (const item of items) {
			if (!item) continue;
			if (item.type === 'function_call') pendingCalls.push(item);
			else if (item.type === 'message' && (item.role === 'assistant' || !item.role)) {
				const text = messageText(item);
				if (text) {
					flushCalls();
					recordedText += text;
					container.appendChild(messageBlock(text));
				}
			}
		}
		flushCalls();
		const full = textValue(entry.assistant);
		// assistant 是整段文字。只補上 response_items 未記錄的部分，不重複顯示。
		if (!recordedText) container.appendChild(messageBlock(full));
		else if (full.startsWith(recordedText) && full.length > recordedText.length) {
			container.appendChild(messageBlock(full.slice(recordedText.length)));
		}
	}

	function makeEditButton(entry, index, field) {
		const button = document.createElement('button');
		button.type = 'button';
		button.textContent = '編輯';
		button.classList.add('editButton');
		button.setAttribute('aria-label', `編輯${field === 'system' ? '系統訊息' : field === 'user' ? '使用者訊息' : '助理訊息'}`);
		if (field === 'assistant' && hasToolCalls(entry)) {
			button.disabled = true;
			button.title = '此對話有工具呼叫，無法編輯助理訊息';
		}
		button.addEventListener('click', () => startEdit(entry, index, field));
		return button;
	}

	function createMessageSection(entry, index, field, label) {
		const section = document.createElement('section');
		section.classList.add('message-section', `role-${field}`);
		const header = document.createElement('div');
		header.classList.add('section-header');
		const role = document.createElement('div');
		role.classList.add('role-label');
		role.textContent = label;
		header.append(role, makeEditButton(entry, index, field));
		const body = document.createElement('div');
		body.classList.add('message-body');
		section.append(header, body);
		return { section, body };
	}

	function renderEditableContent(entry, index, field, body) {
		if (editingState && editingState.index === index && editingState.field === field) {
			const editContainer = document.createElement('div');
			editContainer.classList.add('edit-container');
			const textarea = document.createElement('textarea');
			textarea.classList.add('edit-textarea');
			textarea.setAttribute('aria-label', `編輯${field === 'system' ? '系統訊息' : field === 'user' ? '使用者訊息' : '助理訊息'}`);
			textarea.value = editingState.value;
			autoResizeTextarea(textarea);
			textarea.addEventListener('input', () => autoResizeTextarea(textarea));
			const actions = document.createElement('div');
			actions.classList.add('edit-actions');
			const saveBtn = document.createElement('button');
			saveBtn.type = 'button';
			saveBtn.textContent = '儲存';
			saveBtn.classList.add('edit-save');
			const cancelBtn = document.createElement('button');
			cancelBtn.type = 'button';
			cancelBtn.textContent = '取消';
			cancelBtn.classList.add('edit-cancel');
			saveBtn.addEventListener('click', () => { entry[field] = textarea.value; editingState = null; updateConversation(); });
			cancelBtn.addEventListener('click', () => { editingState = null; updateConversation(); });
			actions.append(saveBtn, cancelBtn);
			editContainer.append(textarea, actions);
			body.appendChild(editContainer);
			setTimeout(() => autoResizeTextarea(textarea), 0);
		} else {
			const content = document.createElement('div');
			content.classList.add('message-content');
			renderMarkdown(content, entry[field], field === 'user' ? userMd : md);
			body.appendChild(content);
		}
	}

	function renderFile(file) {
		if (!file || typeof file !== 'object' || Array.isArray(file)) return null;
		const attachment = document.createElement('div');
		attachment.classList.add('file-attachment');
		// 尚未定義下載 API：只展示中繼資料，不產生無效的連結。
		const icon = document.createElement('span');
		icon.classList.add('file-icon');
		icon.setAttribute('aria-hidden', 'true');
		icon.textContent = '📄';
		const details = document.createElement('div');
		details.classList.add('file-details');
		const name = document.createElement('div');
		name.classList.add('file-name');
		name.textContent = typeof file.filename === 'string' && file.filename ? file.filename : '未命名檔案';
		const type = document.createElement('div');
		type.classList.add('file-type');
		type.textContent = typeof file.content_type === 'string' && file.content_type ? file.content_type : '檔案附件';
		details.append(name, type);
		attachment.append(icon, details);
		return attachment;
	}

	function renderReasoning(reasoning, body) {
		if (!textValue(reasoning)) return;
		const toggleBtn = document.createElement('button');
		toggleBtn.type = 'button';
		toggleBtn.textContent = '查看思考';
		toggleBtn.classList.add('reasoning-toggle');
		const reasoningDiv = document.createElement('div');
		reasoningDiv.classList.add('reasoning-box');
		renderMarkdown(reasoningDiv, reasoning);
		toggleBtn.setAttribute('aria-expanded', 'false');
		toggleBtn.addEventListener('click', () => {
			const isOpen = reasoningDiv.classList.toggle('show');
			toggleBtn.textContent = isOpen ? '隱藏思考' : '查看思考';
			toggleBtn.setAttribute('aria-expanded', String(isOpen));
		});
		body.append(toggleBtn, reasoningDiv);
	}

	function createConversation(entry, index) {
		const conversationDiv = document.createElement('article');
		conversationDiv.classList.add('conversation');
		if (editingState && editingState.index === index) conversationDiv.classList.add('editing');
		const header = document.createElement('div');
		header.classList.add('conversation-header');
		if (entry.id === 0) {
			const title = document.createElement('span');
			title.classList.add('conversation-identity');
			title.textContent = '系統訊息';
			header.appendChild(title);
			conversationDiv.appendChild(header);
			const system = createMessageSection(entry, index, 'system', 'SYSTEM');
			renderEditableContent(entry, index, 'system', system.body);
			conversationDiv.appendChild(system.section);
		} else {
			const identity = document.createElement('label');
			identity.classList.add('conversation-identity', 'select-conversation');
			const checkbox = document.createElement('input');
			checkbox.type = 'checkbox';
			checkbox.checked = true;
			checkbox.classList.add('checkbox');
			checkbox.setAttribute('aria-label', `選取對話 ${entry.id ?? index + 1}`);
			const id = document.createElement('span');
			id.classList.add('id');
			id.textContent = `對話 #${entry.id ?? index + 1}`;
			identity.append(checkbox, id);
			header.appendChild(identity);
			if (typeof entry.model === 'string' && entry.model) {
				const model = document.createElement('span');
				model.classList.add('modelInfo');
				model.textContent = entry.model;
				header.appendChild(model);
			}
			conversationDiv.appendChild(header);
			const user = createMessageSection(entry, index, 'user', '使用者');
			renderEditableContent(entry, index, 'user', user.body);
			if (typeof entry.image_url === 'string' && entry.image_url) {
				const image = document.createElement('img');
				image.src = '/api/chat-images/' + entry.image_url;
				image.alt = '使用者提供的圖片';
				image.classList.add('user-image');
				user.body.appendChild(image);
			}
			const file = renderFile(entry.file);
			if (file) user.body.appendChild(file);
			conversationDiv.appendChild(user.section);
			const assistant = createMessageSection(entry, index, 'assistant', '助理');
			renderReasoning(entry.reasoning, assistant.body);
			if (hasToolCalls(entry)) renderAssistantTimeline(entry, assistant.body);
			else renderEditableContent(entry, index, 'assistant', assistant.body);
			conversationDiv.appendChild(assistant.section);
		}
		conversationContainer.appendChild(conversationDiv);
	}

	function startEdit(entry, index, field) {
		if (field === 'assistant' && hasToolCalls(entry)) return;
		if (field === 'assistant' && index === json.length - 1) shouldScrollToBottom = true;
		editingState = { index, field, value: cleanText(entry[field]) };
		updateConversation();
	}

	function autoResizeTextarea(textarea) {
		textarea.style.height = 'auto';
		textarea.style.height = textarea.scrollHeight + 'px';
	}

	function scrollToLastConversation() {
		const conversations = conversationContainer.querySelectorAll('.conversation');
		if (conversations.length) conversations[conversations.length - 1].scrollIntoView({ behavior: 'auto', block: 'start' });
	}

	function cleanText(text) {
		return textValue(text).replace(/^\n+/, '');
	}

	function updateConversation() {
		const checkboxStates = Array.from(conversationContainer.querySelectorAll('.checkbox')).map(checkbox => checkbox.checked);
		conversationContainer.replaceChildren();
		json.forEach((entry, i) => createConversation(entry, i));
		if (shouldScrollToBottom) {
			requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'auto' }));
			shouldScrollToBottom = false;
		}
		conversationContainer.querySelectorAll('.checkbox').forEach((checkbox, i) => { checkbox.checked = checkboxStates[i] ?? true; });
	}

	function getSelectedMessages() {
		const selectedMessages = [];
		const conversationDivs = conversationContainer.querySelectorAll('.conversation');
		json.forEach((entry, i) => {
			if (entry.id === 0) selectedMessages.push({ id: entry.id, system: entry.system });
			else if (conversationDivs[i]?.querySelector('.checkbox')?.checked) {
				const message = {
					id: entry.id, user: entry.user, assistant: cleanText(entry.assistant),
					reasoning: entry.reasoning || null, model: entry.model || null,
					image_url: entry.image_url || null, response_items: entry.response_items
				};
				// 舊紀錄不必有 file；有附件的紀錄在送出與複製時則不能掉資料。
				if (entry.file != null) message.file = entry.file;
				selectedMessages.push(message);
			}
		});
		return selectedMessages;
	}

	function submitMessages() {
		const selectedMessages = getSelectedMessages();
		if (selectedMessages.length === 1 && selectedMessages[0].id === 0 &&
			!confirm("You haven't selected any messages except the system message. Do you want to continue?")) return;
		fetch(`/api/chat/${chatid}`, {
			method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(selectedMessages)
		}).then(response => {
			if (response.status === 204) { alert('Messages submitted successfully!'); location.reload(); }
			else alert(`Error submitting messages. (${response.status})`);
		}).catch(error => alert(`Error submitting messages. (${error})`));
	}

	function newMessages() {
		const selectedMessages = getSelectedMessages();
		if (selectedMessages.length === 1 && selectedMessages[0].id === 0) {
			alert('Selected message cannot be empty except the system message.'); return;
		}
		const chatName = prompt('Please enter the chat name:');
		if (chatName === null) return;
		if (!chatName) { alert('Chat name cannot be empty. Please try again.'); return; }
		const newJson = reindexMessages(selectedMessages);
		const postData = { name: chatName, chatid, message: newJson, lastid: newJson[newJson.length - 1].id };
		fetch('/api/chat/new', {
			method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(postData)
		}).then(response => {
			if (response.status === 204) alert('Messages submitted successfully!');
			else alert(`Error submitting messages. (${response.status})`);
		}).catch(error => alert(`Error submitting messages. (${error})`));
	}

	function reindexMessages(messages) {
		let newIndex = 0;
		return messages.map(entry => entry.system !== undefined ? { ...entry, id: 0 } : { ...entry, id: ++newIndex });
	}

	json.forEach((entry, index) => createConversation(entry, index));
	scrollToLastConversation();
	const submitButton = document.getElementById('submitBtn');
	const newButton = document.getElementById('newBtn');
	submitButton.addEventListener('click', async () => {
		if (submitButton.disabled) return;
		submitButton.disabled = newButton.disabled = true;
		await new Promise(r => setTimeout(r, 40));
		try { await submitMessages(); }
		finally { await new Promise(r => setTimeout(r, 1000)); submitButton.disabled = newButton.disabled = false; }
	});
	newButton.addEventListener('click', async () => {
		if (newButton.disabled) return;
		newButton.disabled = submitButton.disabled = true;
		await new Promise(r => setTimeout(r, 40));
		try { await newMessages(); }
		finally { newButton.disabled = submitButton.disabled = false; }
	});
	conversationContainer.addEventListener('click', async event => {
		const button = event.target.closest('.copy-code-btn');
		if (!button) return;
		const code = button.closest('.code-block')?.querySelector('code');
		if (!code) return;
		try {
			await navigator.clipboard.writeText(code.textContent);
			button.textContent = '已複製！';
			setTimeout(() => { button.textContent = '複製'; }, 1500);
		} catch {
			button.textContent = '複製失敗';
			setTimeout(() => { button.textContent = '複製'; }, 1500);
		}
	});
}).catch(error => alert(`Error fetching chat log. (${error.status ?? error})`));
</script>
</body>
</html>
