<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Passkeys | modbot</title>

	<link rel="icon" href="/favicon/favicon.ico">

	<style>
		:root {
			--bg: #f5f5f5;
			--card: #ffffff;
			--menu: #ffffff;
			--border: #d9d9d9;
			--text: #000000;
			--text-secondary: #888;
		}

		body {
			margin: 0;
			font-family: "Microsoft JhengHei", sans-serif;
			background: #f0f0f0;
			color: #000;
		}

		.logo {
			position: absolute;
			top: 10px;
			left: 10px;

			margin-top: 20px;
			margin-left: 25px;

			font-size: 22px;
			font-weight: bold;

			text-decoration: none;
			color: inherit;
		}

		.container {
			max-width: 800px;
			margin: 100px auto 40px;
			padding: 0 16px;
		}

		.page-title {
			font-size: 32px;
			font-weight: bold;
			margin-bottom: 24px;
		}
		.page-icon {
			font-size: 28px;
			line-height: 1;
		}

		.toolbar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 20px;
		}

		.create-btn {
			background: #248046;
			color: white;
			border: none;
			border-radius: 8px;
			padding: 10px 16px;
			font-size: 15px;
			cursor: pointer;
			transition: .15s;
		}

		.create-btn:hover {
			filter: brightness(1.08);
		}

		.passkey-list {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.passkey-item {
			background: white;
			border: 1px solid #ccc;
			border-radius: 8px;
			padding: 14px 16px;
			transition: .15s;
			position:relative;
		}

		.passkey-item:hover {
			background: #f8f8f8;
		}

		.passkey-top {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 8px;
		}

		.passkey-name {
			font-size: 18px;
			font-weight: bold;
		}

		.passkey-created,
		.passkey-last-used {
			color: #666;
			font-size: 14px;
			margin-top: 2px;
		}

		.passkey-id {
			margin-top: 8px;
			font-size: 12px;
			color:var(--text-secondary);
			font-family: Consolas, monospace;
			word-break: break-all;
		}

		.empty {
			text-align: center;
			color:var(--text-secondary);
			padding: 60px 0;
			font-size: 16px;
		}

		.more-btn{
			position:absolute;
			top:10px;
			right:10px;
			border:none;
			background:none;
			font-size:20px;
			cursor:pointer;
			color:inherit;
		}

		.menu{
			position:absolute;
			right:10px;
			top:42px;
			display:none;
			border:1px solid #666;
			border-radius:8px;
			min-width:140px;
			overflow:hidden;
			z-index:100;
		}

		.menu button{
			display:block;
			width:100%;
			padding:10px 14px;
			border:none;
			color:inherit;
			text-align:left;
			cursor:pointer;
			font-size: 18px;
			background-color: white;
		}

		.menu button:hover{
			background:#eee;
		}

		.dialog-overlay{
			position: fixed;
			left:0;
			top:0;
			width:100vw;
			height:100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: rgba(0,0,0,.45);
			z-index: 10000;
		}

		.dialog{
			width:min(420px,90vw);
			max-height:90dvh;
			background:var(--card);
			border:1px solid var(--border);
			border-radius:16px;
			padding:20px;
			box-sizing:border-box;
			display:flex;
			flex-direction:column;
		}

		.dialog-body{
			overflow-y:auto;
			flex:1;
		}

		.dialog-buttons{
			display:flex;
			flex-shrink:0;
			justify-content:flex-end;
			gap:12px;
			margin-top:20px;
		}

		.dialog-buttons button{
			padding:10px 18px;
			border-radius:10px;
			border:none;
			cursor:pointer;
			font-size:16px;
		}

		.dialog-danger{
			background:#c62828;
			color:white;
		}

		.dialog-primary{
			background:#2d8c46;
			color:white;
		}

		.dialog input{
			width:100%;
			box-sizing:border-box;
			font-size:16px;
			padding:12px 14px;
			border-radius:10px;
			background-color: var(--menu);
			color: var(--text);
			margin-top: 20px;
		}

		.dialog-header p{
			margin:8px 0 0;
			color:var(--text-secondary);
			font-size:15px;
			line-height:1.5;
		}

		.detail-item{
			padding:14px 0;
			border-bottom:1px solid var(--border);
		}

		.detail-item:last-child{
			border-bottom:none;
		}

		.detail-label{
			font-size:13px;
			color:#888;
			margin-bottom:6px;
		}

		.detail-value{
			word-break:break-all;
			font-size:15px;
			line-height:1.5;
		}

		.hidden{
			display:none;
		}

		@media (prefers-color-scheme: dark) {

			:root {
				--bg: #222222;
				--card: #121212;
				--menu: #1f1f1f;
				--border: #555555;
				--text: #ffffff;
			}

			body {
				background: #1f1f1f;
				color: white;
			}

			.passkey-item {
				background: #000;
				border-color: #555;
			}

			.passkey-item:hover {
				background: #111;
			}

			.passkey-created,
			.passkey-last-used {
				color: #bbb;
			}

			.passkey-id {
				color: #888;
			}

			.create-btn {
				background: #248046;
			}

			.more-btn{
				color: white;
			}

			.menu button{
				background-color: #1f1f1f;
			}

			.menu button:hover{
				background:rgba(255,255,255,.08);
			}
		}

		@media (max-width: 768px) {

    .toolbar {
      flex-direction: column;
      align-items: stretch;
      gap: 16px;
    }

    .create-btn {
     	width: 100%;
    }

		.page-title{
      font-size: 26px;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 12px;
    }

		.page-icon{
			font-size: 22px;
		}

	}
	</style>
</head>

<body>

<a class="logo" href="/">modbot.dev</a>

<div class="container">

	<div class="toolbar">
		<div class="page-title">
    <span class="page-icon">🔑</span>
    <span>Passkeys</span>
	</div>

		<button class="create-btn" id="createBtn">
			＋ 建立新的 Passkey
		</button>
	</div>

	<div class="passkey-list" id="passkeyList">

		<!-- JavaScript 動態產生 -->

	</div>

<div id="dialogOverlay" class="dialog-overlay hidden">

	<div class="dialog">

		<div class="dialog-header">

			<h2 id="dialogTitle"></h2>

			<p id="dialogMessage"></p>

		</div>

		<div
			id="dialogBody"
			class="dialog-body">
		</div>

		<div
			id="dialogButtons"
			class="dialog-buttons">
		</div>

	</div>

</div>

</div>

<script>

const list = document.getElementById("passkeyList");
const createBtn = document.getElementById("createBtn");

let passkeys = [];

const dialogOverlay = document.getElementById("dialogOverlay");
const dialogTitle = document.getElementById("dialogTitle");
const dialogBody = document.getElementById("dialogBody");
const dialogMessage = document.getElementById("dialogMessage");
const dialogButtons = document.getElementById("dialogButtons");

loadPasskeys();

createBtn.addEventListener("click", registerPasskey);

function base64urlToUint8Array(base64url) {

	let base64 = base64url.replace(/-/g, "+").replace(/_/g, "/");

	while (base64.length % 4)
		base64 += "=";

	const binary = atob(base64);

	const bytes = new Uint8Array(binary.length);

	for (let i = 0; i < binary.length; i++)
		bytes[i] = binary.charCodeAt(i);

	return bytes;

}

function uint8ArrayToBase64url(bytes) {

	let binary = "";

	for (const b of bytes)
		binary += String.fromCharCode(b);

	return btoa(binary)
		.replace(/\+/g, "-")
		.replace(/\//g, "_")
		.replace(/=/g, "");

}

function credentialToJSON(credential) {

	return {
		id: credential.id,
		rawId: uint8ArrayToBase64url(new Uint8Array(credential.rawId)),
		type: credential.type,

		authenticatorAttachment: credential.authenticatorAttachment,

		clientExtensionResults: credential.getClientExtensionResults(),

		response: {
			clientDataJSON: uint8ArrayToBase64url(
				new Uint8Array(credential.response.clientDataJSON)
			),

			attestationObject: uint8ArrayToBase64url(
				new Uint8Array(credential.response.attestationObject)
			),

			authenticatorData: credential.response.authenticatorData
				? uint8ArrayToBase64url(
					new Uint8Array(credential.response.authenticatorData)
				)
				: null,

			publicKey: credential.response.publicKey
				? uint8ArrayToBase64url(
					new Uint8Array(credential.response.publicKey)
				)
				: null,

			publicKeyAlgorithm: credential.response.publicKeyAlgorithm,

			transports: credential.response.getTransports
				? credential.response.getTransports()
				: []
		}
	};

}

function assertionToJSON(assertion) {

	return {

		id: assertion.id,

		rawId: uint8ArrayToBase64url(
			new Uint8Array(assertion.rawId)
		),

		type: assertion.type,

		authenticatorAttachment:
			assertion.authenticatorAttachment,

		clientExtensionResults:
			assertion.getClientExtensionResults(),

		response: {

			clientDataJSON: uint8ArrayToBase64url(
				new Uint8Array(
					assertion.response.clientDataJSON
				)
			),

			authenticatorData: uint8ArrayToBase64url(
				new Uint8Array(
					assertion.response.authenticatorData
				)
			),

			signature: uint8ArrayToBase64url(
				new Uint8Array(
					assertion.response.signature
				)
			),

			userHandle: assertion.response.userHandle
				? uint8ArrayToBase64url(
					new Uint8Array(
						assertion.response.userHandle
					)
				)
				: null

		}

	};

}

async function registerPasskey() {

	try {

	let options;

	if (passkeys.length === 0) {

		options = await beginRegister();

	}
	else {

		const loginOptions = await beginLogin();

		const assertion = await getAssertion(
			loginOptions
		);

		options = await beginRegister(
			assertionToJSON(assertion)
		);

	}
		const credential = await createCredential(
			options
		);

		const result = await finishRegister(
			credential
		);

		console.log(result);

		await loadPasskeys();

	}
	catch (err) {

		console.error(err);

		if (err.name === "NotAllowedError")
			return;

		if (err.name === "InvalidStateError") {

			await showDialog({

				title:"❌ 錯誤",

				body:"此裝置已經註冊過 Passkey。",

				buttons:[
					{
						text:"關閉",
						value:true,
						primary:true
					}
				]

			});

			return;

		}

		await showError(err);

	}

}

async function beginRegister(assertion = null) {

	const res = await fetch("/api/passkeys", {

		method: "POST",

		headers: {
			"Content-Type": "application/json"
		},

		body: JSON.stringify({

			op: "begin_register",

			d: {
				credential: assertion
			}

		})

	});

	if (!res.ok)
		throw new Error(`HTTP ${res.status} ${await res.text()}`);

	return await res.json();

}

async function createCredential(options) {

	options.challenge = base64urlToUint8Array(
		options.challenge
	);

	options.user.id = base64urlToUint8Array(
		options.user.id
	);

	if (options.excludeCredentials) {

		for (const credential of options.excludeCredentials) {

			credential.id = base64urlToUint8Array(
				credential.id
			);

		}

	}

	return await navigator.credentials.create({

		publicKey: options

	});

}

async function finishRegister(credential) {

	const body = credentialToJSON(credential);

	const res = await fetch("/api/passkeys", {

		method: "POST",

		headers: {
			"Content-Type": "application/json"
		},

		body: JSON.stringify({

			op: "finish_register",

			d: {
				credential: body
			}

		})

	});

	if (!res.ok)
		throw new Error(
			`HTTP ${res.status} ${await res.text()}`
		);

	return await res.json();

}

async function beginLogin() {

    const res = await fetch("/api/passkeys", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            op: "begin_login",

            d: {
							provider: "passkey"
						}

        })

    });

    if (!res.ok)
        throw new Error(`HTTP ${res.status} ${await res.text()}`);

    return await res.json();

}

async function getAssertion(options) {

	options.challenge = base64urlToUint8Array(
		options.challenge
	);

	if (options.allowCredentials) {

		for (const credential of options.allowCredentials) {

			credential.id = base64urlToUint8Array(
				credential.id
			);

		}

	}

	return await navigator.credentials.get({

		publicKey: options

	});

}

function showDialog({

	title = "",

	body = null,

	message = "",

	buttons = []

}){

	return new Promise(resolve=>{

		dialogTitle.textContent = title;

		dialogBody.innerHTML = "";

		dialogButtons.innerHTML = "";

		if (message) {

			dialogMessage.textContent = message;
			dialogMessage.style.display = "";

		} else {

			dialogMessage.style.display = "none";

		}

		if(body)
			dialogBody.append(body);

		dialogOverlay.classList.remove("hidden");

		function close(value){

			dialogOverlay.classList.add("hidden");

			resolve(value);

		}

		for(const button of buttons){

			const b = document.createElement("button");

			b.textContent = button.text;

			if(button.primary)
				b.classList.add("dialog-primary");

			if(button.danger)
				b.classList.add("dialog-danger");

			b.addEventListener("click",()=>{

				close(button.value);

			});

			dialogButtons.appendChild(b);

		}

	});

}

async function getPasskeyDetail(credentialId){

	const res = await fetch("/api/passkeys",{

		method:"POST",

		headers:{
			"Content-Type":"application/json"
		},

		body:JSON.stringify({
			op:"detail",
			d:{
				credentialId
			}

		})

	});

	if(!res.ok)
		throw new Error(await res.text());

	return await res.json();

}

async function renamePasskey(credentialId, name) {

	if (name.length === 0) {
		alert("名稱不能為空");
		return;
	}

	const res = await fetch("/api/passkeys", {

		method: "POST",
		headers: {
			"Content-Type": "application/json"
		},

		body: JSON.stringify({
			op: "rename",
			d: {
				credentialId,
				name
			}
		})

	});

	if (!res.ok) {
		alert(await res.text());
		return;
	}

	await loadPasskeys();

}

async function deletePasskey(credentialId){

	const res = await fetch("/api/passkeys",{

		method:"POST",

		headers:{
			"Content-Type":"application/json"
		},

		body:JSON.stringify({

			op:"delete",

			d:{
				credentialId
			}

		})

	});

	if(!res.ok)
		throw new Error(await res.text());

}

async function loadPasskeys() {

	try {

		const res = await fetch("/api/passkeys");

		if (!res.ok) {
			throw new Error(`HTTP ${res.status}`);
		}

		const data = await res.json();

		passkeys = data;

		renderList(data);

	}
	catch (err) {

		console.error(err);

		list.innerHTML = `
			<div class="empty">
				載入 Passkey 失敗
			</div>
		`;

	}

}

function renderList(passkeys) {

	list.innerHTML = "";

	if (!passkeys.length) {

		list.innerHTML = `
			<div class="empty">
				目前沒有任何 Passkey
			</div>
		`;

		return;

	}

	passkeys.forEach(passkey => {

		const item = createPasskeyItem(passkey);

		list.appendChild(item);

	});

}

	function createPasskeyItem(passkey) {

	const item = document.createElement("div");

	item.className = "passkey-item";

	item.innerHTML = `
		<div class="passkey-top">

			<div class="passkey-name">
				🔑 ${escapeHtml(passkey.name)}
			</div>

			<button class="more-btn">⋯</button>

			<div class="menu">

				<button class="rename">
					重新命名
				</button>

				<button class="detail">
					詳細資訊
				</button>

				<button class="delete">
					刪除
				</button>

			</div>

		</div>

		<div class="passkey-created">
			建立時間：${formatTime(passkey.createdAt)}
		</div>

		<div class="passkey-last-used">
			最後使用：${formatLastUsed(passkey.lastUsedAt)}
		</div>

		<div class="passkey-id">
			${escapeHtml(passkey.credentialId)}
		</div>
	`;

	bindMoreButton(item);
	bindRenameButton(item, passkey);
	bindDetailButton(item, passkey);
	bindDeleteButton(item, passkey);

	return item;

}

async function showError(err) {

    console.error(err);

    if (err.status !== undefined) {
			await showDialog({
			title:"❌ 錯誤",
			body:`${err.status} ${err.message}`,
			buttons:[
				{
					text:"關閉",
					value:true,
					primary:true
				}
			]
		});
		}
		else {
			await showDialog({
			title:"❌ 錯誤",
			body: err.message,
			buttons:[
				{
					text:"關閉",
					value:true,
					primary:true
				}
			]
		});
		}

}

	function bindMoreButton(item) {

	const moreBtn = item.querySelector(".more-btn");
	const menu = item.querySelector(".menu");

	moreBtn.onclick = e => {

		e.stopPropagation();

		menu.style.display =
			menu.style.display === "block"
				? "none"
				: "block";

	};

}

	function bindRenameButton(item, passkey) {

	const menu = item.querySelector(".menu");
	const renameBtn = item.querySelector(".rename");

	renameBtn.addEventListener("click", async e => {

		e.stopPropagation();

		menu.style.display = "none";

		try {

		const input = document.createElement("input");

		input.type = "text";
		input.value = passkey.name;

		const ok = await showDialog({

			title: "✏️ 重新命名",

			body: input,

			message: "請輸入新的 Passkey 名稱",

			buttons: [

				{
					text: "取消",
					value: false
				},

				{
					text: "儲存",
					value: true,
					primary: true
				}

			]

		});

		if (!ok)
			return;

		await renamePasskey(
			passkey.credentialId,
			input.value.trim()
		);

		}
catch (err) {
    await showError(err);
}

	});

}

	function bindDetailButton(item, passkey) {

	const menu = item.querySelector(".menu");
	const detailBtn = item.querySelector(".detail");

	detailBtn.addEventListener("click", async e => {

		e.stopPropagation();

		menu.style.display = "none";

		try {

		const detail = await getPasskeyDetail(
			passkey.credentialId
		);

		const container = document.createElement("div");

		container.className = "detail-list";

		container.append(

			createDetailItem("名稱", detail.name),
			createDetailItem("Credential ID", detail.credentialId),
			createDetailItem("AAGUID", detail.aaguid),
			createDetailItem("Sign Count", detail.signCount),
			createDetailItem("Public Key", detail.publicKey),
			createDetailItem("建立時間", formatTime(detail.createdAt)),
			createDetailItem("最後使用", formatLastUsed(detail.lastUsedAt))

		);

		await showDialog({

			title: "📖 詳細資訊",

			body: container,

			buttons: [

				{
					text: "關閉",
					value: true,
					primary: true
				}

			]

		});

		}
catch (err) {
    await showError(err);
}

	});

}

	function bindDeleteButton(item, passkey) {

	const menu = item.querySelector(".menu");
	const deleteBtn = item.querySelector(".delete");

	deleteBtn.addEventListener("click", async e => {

		e.stopPropagation();

		menu.style.display = "none";

		try {

		const text = document.createElement("div");

		text.textContent = "確定要刪除這把 Passkey？";

		const ok = await showDialog({

			title: "🗑️ 刪除 Passkey",

			body: text,

			buttons: [

				{
					text: "取消",
					value: false
				},

				{
					text: "刪除",
					value: true,
					danger: true
				}

			]

		});

		if (!ok)
			return;

		await deletePasskey(
			passkey.credentialId
		);

		await loadPasskeys();

	}	
	catch (err) {
    await showError(err);
	}
	});
	

}

	document.addEventListener("click", () => {

	document.querySelectorAll(".menu").forEach(menu => {

		menu.style.display = "none";

	});

	});

function createDetailItem(title, value){

	const item = document.createElement("div");

	item.className = "detail-item";

	const label = document.createElement("div");

	label.className = "detail-label";

	label.textContent = title;

	const content = document.createElement("div");

	content.className = "detail-value";

	content.textContent = value;

	item.append(label, content);

	return item;

}

function formatTime(ts) {

	if (!ts)
		return "未知";

	if (ts.toString().length === 10)
		ts *= 1000;

	const date = new Date(ts);

	return date.toLocaleString("zh-TW", {
		year: "numeric",
		month: "2-digit",
		day: "2-digit",
		hour: "2-digit",
		minute: "2-digit",
		hour12: false
	});

}

function formatLastUsed(ts) {

	if (!ts)
		return "從未使用";

	return formatTime(ts);

}

function escapeHtml(str) {

	const div = document.createElement("div");

	div.textContent = str ?? "";

	return div.innerHTML;

}</script>
