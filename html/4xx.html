<!DOCTYPE html>
<html>
	<head>
		<title>Error | modbot</title>
		<link rel="apple-touch-icon" sizes="120x120" href="/favicon/apple-touch-icon.png">
		<link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<style>
			:root {
			--bg: #f0f0f0;
			--card: #ffffff;
			--menu: #ffffff;
			--border: #d9d9d9;
			--text: #000000;
			--text-secondary: #888;
			}
			body {
				display: flex;
				justify-content: center;
				align-items: flex-start;
				height: 100vh;
				margin: 0;
				background-color: var(--bg);
				color: var(--text);
				margin-top: 100px;
				font-family: 'Microsoft JhengHei', sans-serif;
			}
			.logo {
				position: absolute;
				top: 10px;
				left: 10px;
				font-weight: bold;
				margin-top: 20px;
				margin-left: 25px;
				font-size: 22px;
				text-decoration: none;
				color: var(--text);
			}
      .container {
	      display: flex;
	      flex-direction: column;
	      align-items: center;
	      text-align: center;
	      max-width: 420px;
	      padding: 32px;
      }

      .icon {
	      font-size: 56px;
	      margin-bottom: 20px;
      }

      h1 {
	      margin: 0;
	      font-size: 30px;
	      font-weight: 600;
      }

      .description {
	      margin-top: 16px;
	      color: var(--text-secondary);
	      font-size: 15px;
	      line-height: 1.6;
      }

      .footer {
	      margin-top: 56px;
	      font-size: 14px;
	      color: var(--text-secondary);
      }

      .footer button {
	      padding: 0;
	      border: none;
	      background: none;
	      color: #5865F2;
	      font: inherit;
	      cursor: pointer;
      }

      .footer button:hover {
	      text-decoration: underline;
      }

		.hidden{
			display:none;
		}
      
			@media (prefers-color-scheme: dark) {
				:root {
				--bg: #222222;
				--card: #121212;
				--menu: #1f1f1f;
				--border: #555555;
				--text: #ffffff;
				}
			}
		</style>
	</head>

<body>

	<a class="logo" href="/">modbot.dev</a>

	<div class="container">

		<div class="icon">{{ icon }}</div>

		<h1>{{ title }}</h1>

		<div class="description">
			{{ description }}
		</div>
		{% if footer %}
		<div class="footer">
			{{ footer }}
		</div>
		{% endif %}
	</div>
</body>
</html>
