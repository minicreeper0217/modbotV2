<!DOCTYPE html>
<html>
	<head>
		<title>Template | modbot</title>
		<link rel="apple-touch-icon" sizes="120x120" href="/favicon/apple-touch-icon.png">
		<link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<style>
			:root {
			--bg: #f0f0f0;
			--card: #ffffff;
			--menu: #ffffff;
			--border: #d9d9d9;
			--text: #000000;
			--text-secondary: #888;
			}
			body {
				display: flex;
				justify-content: center;
				align-items: flex-start;
				height: 100vh;
				margin: 0;
				background-color: var(--bg);
				color: var(--text);
				margin-top: 100px;
				font-family: 'Microsoft JhengHei', sans-serif;
			}
			.logo {
				position: absolute;
				top: 10px;
				left: 10px;
				font-weight: bold;
				margin-top: 20px;
				margin-left: 25px;
				font-size: 22px;
				text-decoration: none;
				color: var(--text);
			}
		.dialog-overlay{
			position: fixed;
			left:0;
			top:0;
			width:100vw;
			height:100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: rgba(0,0,0,.45);
			z-index: 10000;
		}
		.dialog{
			width:min(420px,90vw);
			max-height:90dvh;
			background:var(--card);
			border:1px solid var(--border);
			border-radius:16px;
			padding:20px;
			box-sizing:border-box;
			display:flex;
			flex-direction:column;
		}
		.dialog-body{
			overflow-y:auto;
			flex:1;
		}
		.dialog-buttons{
			display:flex;
			flex-shrink:0;
			justify-content:flex-end;
			gap:12px;
			margin-top:20px;
		}
		.dialog-buttons button{
			padding:10px 18px;
			border-radius:10px;
			border:none;
			cursor:pointer;
			font-size:16px;
		}
		.dialog-danger{
			background:#c62828;
			color:white;
		}
		.dialog-primary{
			background:#2d8c46;
			color:white;
		}
		.dialog input{
			width:100%;
			box-sizing:border-box;
			font-size:16px;
			padding:12px 14px;
			border-radius:10px;
			background-color: var(--menu);
			color: var(--text);
			margin-top: 20px;
		}
		.dialog-header p{
			margin:8px 0 0;
			color:var(--text-secondary);
			font-size:15px;
			line-height:1.5;
		}
		.hidden{
			display:none;
		}
			@media (prefers-color-scheme: dark) {
				:root {
				--bg: #222222;
				--card: #121212;
				--menu: #1f1f1f;
				--border: #555555;
				--text: #ffffff;
				}
			}
		</style>
	</head>

	<body>
		<a class="logo" href="/">modbot.dev</a>

	<div id="dialogOverlay" class="dialog-overlay hidden">

	<div class="dialog">

		<div class="dialog-header">

			<h2 id="dialogTitle"></h2>

			<p id="dialogMessage"></p>

		</div>

		<div id="dialogBody" class="dialog-body">
		</div>

		<div id="dialogButtons" class="dialog-buttons">
		</div>

	</div>

	</div>
	</body>

	<script>
		const dialogOverlay = document.getElementById("dialogOverlay");
		const dialogTitle = document.getElementById("dialogTitle");
		const dialogBody = document.getElementById("dialogBody");
		const dialogMessage = document.getElementById("dialogMessage");
		const dialogButtons = document.getElementById("dialogButtons");

	function showDialog({

	title = "",

	body = null,

	message = "",

	buttons = []

}){

	return new Promise(resolve=>{

		dialogTitle.textContent = title;

		dialogBody.innerHTML = "";

		dialogButtons.innerHTML = "";

		if (message) {

			dialogMessage.textContent = message;
			dialogMessage.style.display = "";

		} else {

			dialogMessage.style.display = "none";

		}

		if(body)
			dialogBody.append(body);

		dialogOverlay.classList.remove("hidden");

		function close(value){

			dialogOverlay.classList.add("hidden");

			resolve(value);

		}

		for(const button of buttons){

			const b = document.createElement("button");

			b.textContent = button.text;

			if(button.primary)
				b.classList.add("dialog-primary");

			if(button.danger)
				b.classList.add("dialog-danger");

			b.addEventListener("click",()=>{

				close(button.value);

			});

			dialogButtons.appendChild(b);

		}

	});

}
	</script>
</html>
