<!DOCTYPE html>
<html>
	<head>
		<title>Authentication | modbot</title>
		<link rel="apple-touch-icon" sizes="120x120" href="/favicon/apple-touch-icon.png">
		<link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<style>
			:root {
			--bg: #f0f0f0;
			--card: #ffffff;
			--menu: #ffffff;
			--border: #d9d9d9;
			--text: #000000;
			--text-secondary: #888;
			}
			body {
				display: flex;
				justify-content: center;
				align-items: flex-start;
				height: 100vh;
				margin: 0;
				background-color: var(--bg);
				color: var(--text);
				margin-top: 100px;
				font-family: 'Microsoft JhengHei', sans-serif;
			}
			.logo {
				position: absolute;
				top: 10px;
				left: 10px;
				font-weight: bold;
				margin-top: 20px;
				margin-left: 25px;
				font-size: 22px;
				text-decoration: none;
				color: var(--text);
			}
      .container {
	      display: flex;
	      flex-direction: column;
	      align-items: center;
	      text-align: center;
	      max-width: 420px;
	      padding: 32px;
      }

      .icon {
	      font-size: 56px;
	      margin-bottom: 20px;
      }

      h1 {
	      margin: 0;
	      font-size: 30px;
	      font-weight: 600;
      }

      .description {
	      margin-top: 16px;
	      color: var(--text-secondary);
	      font-size: 15px;
	      line-height: 1.6;
      }

      .footer {
	      margin-top: 56px;
	      font-size: 14px;
	      color: var(--text-secondary);
      }

      .footer button {
	      padding: 0;
	      border: none;
	      background: none;
	      color: #5865F2;
	      font: inherit;
	      cursor: pointer;
      }

      .footer button:hover {
	      text-decoration: underline;
      }

		.dialog-overlay{
			position: fixed;
			left:0;
			top:0;
			width:100vw;
			height:100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: rgba(0,0,0,.45);
			z-index: 10000;
		}

		.dialog{
			width:min(420px,90vw);
			max-height:90dvh;
			background:var(--card);
			border:1px solid var(--border);
			border-radius:16px;
			padding:20px;
			box-sizing:border-box;
			display:flex;
			flex-direction:column;
		}

		.dialog-body{
			overflow-y:auto;
			flex:1;
		}

		.dialog-buttons{
			display:flex;
			flex-shrink:0;
			justify-content:flex-end;
			gap:12px;
			margin-top:20px;
		}

		.dialog-buttons button{
			padding:10px 18px;
			border-radius:10px;
			border:none;
			cursor:pointer;
			font-size:16px;
		}

		.dialog-danger{
			background:#c62828;
			color:white;
		}

		.dialog-primary{
			background:#2d8c46;
			color:white;
		}

		.dialog input{
			width:100%;
			box-sizing:border-box;
			font-size:16px;
			padding:12px 14px;
			border-radius:10px;
			background-color: var(--menu);
			color: var(--text);
			margin-top: 20px;
		}

		.dialog-header p{
			margin:8px 0 0;
			color:var(--text-secondary);
			font-size:15px;
			line-height:1.5;
		}

		.hidden{
			display:none;
		}
      
			@media (prefers-color-scheme: dark) {
				:root {
				--bg: #222222;
				--card: #121212;
				--menu: #1f1f1f;
				--border: #555555;
				--text: #ffffff;
				}
			}
		</style>
	</head>

<body>

	<a class="logo" href="/">modbot.dev</a>

	<div class="container">

		<div class="icon">🔐</div>

		<h1>Waiting for authentication</h1>

		<div class="description">
			Use your passkey to continue.<br>
			Your browser should prompt you automatically.
		</div>

		<div class="footer">
			Can't use your passkey?
			<button onclick="continueWithDiscord()">Continue with Discord</button>
		</div>

	</div>

	<div id="dialogOverlay" class="dialog-overlay hidden">

	<div class="dialog">

		<div class="dialog-header">

			<h2 id="dialogTitle"></h2>

			<p id="dialogMessage"></p>

		</div>

		<div
			id="dialogBody"
			class="dialog-body">
		</div>

		<div
			id="dialogButtons"
			class="dialog-buttons">
		</div>

	</div>

	</div>

	<script>
	const dialogOverlay = document.getElementById("dialogOverlay");
	const dialogTitle = document.getElementById("dialogTitle");
	const dialogBody = document.getElementById("dialogBody");
	const dialogMessage = document.getElementById("dialogMessage");
	const dialogButtons = document.getElementById("dialogButtons");

	async function login() {

	try {

		const response = await fetch("/api/passkeys", {
			method: "POST",
			headers: {
				"Content-Type": "application/json"
			},
			body: JSON.stringify({
				op: "begin_login",
				d: {
					provider: "passkey"
				}
			})
		});

		if (!response.ok)
			throw {
				status: response.status,
				body: await response.text()
			};

		const options = await response.json();

		options.challenge = base64urlDecode(options.challenge);

		const credential = await navigator.credentials.get({
			publicKey: options
		});

		const response2 = await fetch("/api/passkeys", {
			method: "POST",
			headers: {
				"Content-Type": "application/json"
			},
			body: JSON.stringify({
				op: "finish_login",
				d: {
					credential: {
						type: credential.type,
						id: base64urlEncode(credential.rawId),
						response: {
							authenticatorData: base64urlEncode(
								credential.response.authenticatorData
							),
							clientDataJSON: base64urlEncode(
								credential.response.clientDataJSON
							),
							signature: base64urlEncode(
								credential.response.signature
							),
							userHandle: credential.response.userHandle
								? base64urlEncode(credential.response.userHandle)
								: null
						}
					}
				}
			})
		});

		if (!response2.ok)
			throw {
				status: response2.status,
				body: await response2.text()
			};

		const data = await response2.json();

		window.location.href = data.url

	}
	catch (err) {

		if (err.name === "NotAllowedError")
			return;

		if (err.status !== undefined) {
			await showDialog({
			title:"❌ 錯誤",
			body:`${err.status} ${err.body}`,
			buttons:[
				{
					text:"關閉",
					value:true,
					primary:true
				}
			]
		});
		}
		else {
			await showDialog({
			title:"❌ 錯誤",
			body: err,
			buttons:[
				{
					text:"關閉",
					value:true,
					primary:true
				}
			]
		});
		}

		console.error(err);

	}

}

	window.addEventListener("load", () => {
		login();
});
	
	function base64urlDecode(str) {

	str = str.replace(/-/g, "+").replace(/_/g, "/");

	while (str.length % 4)
		str += "=";

	const binary = atob(str);

	const bytes = new Uint8Array(binary.length);

	for (let i = 0; i < binary.length; i++)
		bytes[i] = binary.charCodeAt(i);

	return bytes;

}

function base64urlEncode(buffer) {

	const bytes = new Uint8Array(buffer);

	let binary = "";

	for (const b of bytes)
		binary += String.fromCharCode(b);

	return btoa(binary)
		.replace(/\+/g, "-")
		.replace(/\//g, "_")
		.replace(/=+$/, "");

}

	function showDialog({

	title = "",

	body = null,

	message = "",

	buttons = []

}){

	return new Promise(resolve=>{

		dialogTitle.textContent = title;

		dialogBody.innerHTML = "";

		dialogButtons.innerHTML = "";

		if (message) {

			dialogMessage.textContent = message;
			dialogMessage.style.display = "";

		} else {

			dialogMessage.style.display = "none";

		}

		if(body)
			dialogBody.append(body);

		dialogOverlay.classList.remove("hidden");

		function close(value){

			dialogOverlay.classList.add("hidden");

			resolve(value);

		}

		for(const button of buttons){

			const b = document.createElement("button");

			b.textContent = button.text;

			if(button.primary)
				b.classList.add("dialog-primary");

			if(button.danger)
				b.classList.add("dialog-danger");

			b.addEventListener("click",()=>{

				close(button.value);

			});

			dialogButtons.appendChild(b);

		}

	});

}
async function continueWithDiscord() {

	try {

		const response = await fetch("/api/passkeys", {
			method: "POST",
			headers: {
				"Content-Type": "application/json"
			},
			body: JSON.stringify({
				op: "begin_login",
				d: {
					provider: "discord"
				}
			})
		});

		if (!response.ok)
			throw {
				status: response.status,
				body: await response.text()
			};

		const data = await response.json();

		window.location.href = data.url;

	}
	catch (err) {

		console.error(err);

		if (err.status !== undefined) {

			await showDialog({
			title:"❌ 錯誤",
			body:`${err.status} ${err.body}`,
			buttons:[
				{
					text:"關閉",
					value:true,
					primary:true
				}
			]
		});

		} else {

			await showDialog({
			title:"❌ 錯誤",
			body: err,
			buttons:[
				{
					text:"關閉",
					value:true,
					primary:true
				}
			]
		});

		}

	}

}
</script>

</body>
</html>
